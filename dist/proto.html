      if (o.accountTo) bits.push('на счёт ' + o.accountTo);
      if (o.purposeText) bits.push('назначение платежа: ' + o.purposeText);
    } else {
      if (o.description) bits.push(o.description);
    }
    return bits.join(', ');
  }

  /** Стоимость объекта: явно указанная, а если её нет — сумма сделки. */
  function objectValue(deal) {
    const o = deal.object || {};
    // Рыночная стоимость по решению об оценке — то, что взыскивается
    // при невозможности вернуть имущество в натуре, и то, из чего считается
    // цена иска.
    const market = num((deal.valuation || {}).marketValue);
    if (market != null) return market;
    if (o.value !== '' && o.value != null) return o.value;
    if (o.kind === 'money' && o.sum !== '' && o.sum != null) return o.sum;
    return deal.amount;
  }

  const dealTypeName = (deal) => deal.type === 'other'
    ? (deal.typeOther || 'иная сделка')
    : D.nameOf(D.DEAL_TYPES, deal.type);

  const dealTypeGen = (deal) => {
    if (deal.type === 'other') return deal.typeOther || 'иной сделки';
    const t = D.byId(D.DEAL_TYPES, deal.type);
    return t ? t.gen : '';
  };

  /** «за 8 месяцев», «за 2 года 3 месяца» — расстояние от сделки до возбуждения дела. */
  function periodBefore(dealDate, caseStart) {
    if (!dealDate || !caseStart) return '';
    const a = new Date(dealDate + 'T00:00:00Z'), b = new Date(caseStart + 'T00:00:00Z');
    if (isNaN(a) || isNaN(b) || b < a) return '';
    let months = (b.getUTCFullYear() - a.getUTCFullYear()) * 12 + (b.getUTCMonth() - a.getUTCMonth());
    if (b.getUTCDate() < a.getUTCDate()) months--;
    if (months < 1) {
      const days = Math.round((b - a) / 86400000);
      return 'за ' + days + ' ' + D.plural(days, 'день', 'дня', 'дней');
    }
    const y = Math.floor(months / 12), m = months % 12;
    const out = [];
    if (y) out.push(y + ' ' + D.plural(y, 'год', 'года', 'лет'));
    if (m) out.push(m + ' ' + D.plural(m, 'месяц', 'месяца', 'месяцев'));
    return 'за ' + out.join(' ');
  }

  const grounds = (list, ids, other) => (ids || [])
    .map((id) => (id === 'other' ? (other || 'иное') : D.nameOf(list, id)))
    .filter(Boolean).join('; ').toLowerCase();

  /* ================= контекст переменных ================= */

  /**
   * Плоский набор {{ПЕРЕМЕННАЯ}} → строка. Один источник для предпросмотра,
   * DOCX и печати: расхождений между тем, что видно, и тем, что выгружено,
   * быть не должно.
   */
  function context(db, kase, deal, kind) {
    const debtor = debtorOf(kase);
    const cp = counterpartyOf(kase, deal);
    const proc = D.byId(D.PROCEDURES, kase.procedure);
    const o = deal.object || {};
    const perf = D.byId(D.PERFORMANCE, deal.performance.state);
    const gap = valueGap(deal);
    const claim = claimPrice(deal);
    const fee = feeCalc(deal);
    const feeKnown = fee.manual || claim > 0;
    const total = accountsTotal(kase);

    const v = {
      CASE_NUMBER: kase.number,
      COURT_NAME: kase.court,
      COURT_ADDRESS: kase.courtAddress,
      PROCEDURE: proc ? proc.name : '',
      PROCEDURE_DATE: D.dateLong(kase.procedureDate),
      JUDICIAL_ACT: kase.judicialAct,
      CASE_START_DATE: D.dateLong(kase.caseStartDate),
      MANAGER_ROLE: proc ? proc.manager : '',
      MANAGER_ROLE_GEN: proc ? proc.managerGen : '',
      MANAGER_ROLE_INS: proc ? proc.managerIns : '',
      MANAGER_NAME: kase.managerName || db.profile.name,
      MANAGER_ADDRESS: kase.managerAddress || db.profile.address,
      MANAGER_CONTACTS: kase.managerContacts || db.profile.contacts,
      MANAGER_SRO: kase.managerSro || db.profile.sro,
      MANAGER_INN: kase.managerInn || db.profile.inn,
      MANAGER_SNILS: kase.managerSnils || db.profile.snils,
      MANAGER_REG_NUMBER: kase.managerRegNumber || db.profile.regNumber,
      CREDITORS_SUM: D.money(kase.creditorsSum),

      DEBTOR_NAME: partyName(debtor),
      DEBTOR_NAME_GEN: debtorGen(kase, debtor),
      MANAGER_TITLE: managerTitle(kase, debtor, proc),
      DEBTOR_SHORT: partyShort(debtor),
      DEBTOR_INN: partyInn(debtor),
      DEBTOR_OGRN: partyOgrn(debtor),
      DEBTOR_ADDRESS: partyAddress(debtor),
      DEBTOR_REQUISITES: partyRequisites(debtor),
      DEBTOR_BIRTH_DATE: debtor ? D.dateShort(debtor.birthDate) : '',
      DEBTOR_BIRTH_PLACE: debtor ? debtor.birthPlace : '',
      DEBTOR_SNILS: debtor ? debtor.snils : '',
      // «(15.03.1990 г.р., место рожд.: …, адрес рег.: …, СНИЛС …, ИНН …)» —
      // так реквизиты гражданина печатают в первом абзаце заявления.
      DEBTOR_PASSPORT_BLOCK: debtorBlock(debtor),

      COUNTERPARTY_NAME: partyName(cp),
      COUNTERPARTY_SHORT: partyShort(cp),
      COUNTERPARTY_INN: partyInn(cp),
      COUNTERPARTY_OGRN: partyOgrn(cp),
      COUNTERPARTY_ADDRESS: partyAddress(cp),
      COUNTERPARTY_REQUISITES: partyRequisites(cp),

      DEAL_TYPE: dealTypeName(deal),
      DEAL_TYPE_GEN: dealTypeGen(deal),
      DEAL_DATE: D.dateLong(deal.date),
      DEAL_DATE_SHORT: D.dateShort(deal.date),
      DEAL_NUMBER: deal.number,
      CONTRACT_DATE: D.dateLong(deal.contractDate || deal.date),
      DEAL_AMOUNT: D.money(deal.amount),
      DEAL_AMOUNT_WORDS: D.moneyWords(deal.amount),
      DEAL_CURRENCY: D.nameOf(D.CURRENCIES, deal.currency),
      DEAL_SUBJECT: deal.subject || objectDescription(deal),
      DEAL_PERIOD: periodBefore(deal.date, kase.caseStartDate),

      OBJECT_TYPE: D.nameOf(D.OBJECT_TYPES, o.kind).toLowerCase(),
      OBJECT_DESCRIPTION: objectDescription(deal),
      OBJECT_ADDRESS: o.address,
      CADASTRAL_NUMBER: o.cadastral,
      OBJECT_AREA: o.area,
      OBJECT_VALUE: D.money(objectValue(deal)),
      OBJECT_VALUE_WORDS: D.moneyWords(objectValue(deal)),
      VEHICLE_VIN: o.vin,
      VEHICLE_PLATE: o.plate,
      PAYMENT_ORDER: o.orderNumber,
      PAYMENT_PURPOSE: o.purposeText,
      PAYMENT_DATE: D.dateLong(o.payDate),
      ACCOUNT_FROM: o.accountFrom,
      ACCOUNT_TO: o.accountTo,

      PERFORMANCE_STATE: perf ? perf.name.toLowerCase() : '',
      PERFORMANCE_DATE: D.dateLong(deal.performance.date),
      PERFORMANCE_METHOD: deal.performance.method,

      CONTRACT_PRICE: gap ? D.money(gap.price) : '',
      MARKET_VALUE: gap ? D.money(gap.market) : '',
      MARKET_VALUE_WORDS: gap ? D.moneyWords(gap.market) : '',
      VALUE_GAP: gap ? D.money(gap.gap) : '',
      VALUE_GAP_WORDS: gap ? D.moneyWords(gap.gap) : '',
      VALUE_RATIO: gap ? ratioText(gap.ratio) : '',
      VALUATION_DECISION: (deal.valuation || {}).decision,
      VALUATION_NOTE: (deal.valuation || {}).note,

      AFFILIATION_GROUNDS: grounds(D.AFFILIATION_GROUNDS, deal.affiliationGrounds, deal.affiliationNote),
      AFFILIATION_NOTE: deal.affiliationNote,
      PREFERENCE_GROUNDS: grounds(D.PREFERENCE_GROUNDS, deal.preferenceGrounds, deal.preferenceNote),
      PREFERENCE_NOTE: deal.preferenceNote,
      HARM_NOTE: deal.harmNote,
      SHAM_NOTE: deal.shamNote,
      AWARENESS_NOTE: deal.awarenessNote,
      CIRCUMSTANCES: deal.circumstances,

      // Пока цена иска не заполнена, пошлины нет: имущественная часть
      // неизвестна, и в предпросмотре это место подсветится как незаполненное,
      // а не покажет уверенную сумму из одной твёрдой ставки.
      CLAIM_PRICE: claim > 0 ? D.money(claim) : '',
      FEE_AMOUNT: feeKnown ? D.money(fee.total) : '',
      FEE_WORDS: feeKnown ? D.moneyWords(fee.total) : '',
      FEE_CALC: feeKnown ? feeText(deal) : '',

      TODAY: D.dateLong(new Date().toISOString().slice(0, 10)),
      ATTACHMENTS: attachments(deal, kase, kind).map((a, i) => (i + 1) + '. ' + a).join('\n'),
      ACCOUNTS_BALANCE: total == null ? '' : D.money(total),
      ACCOUNTS_BALANCE_WORDS: total == null ? '' : D.moneyWords(total),
      ACCOUNTS_BANKS: accountsBanksText(kase),
      ACCOUNTS_COUNT: included(kase).length ? String(included(kase).length) : '',
      OFFER_DAYS: kase.offerDays || '10'
    };

    // Цифры из кредитного отчёта — отдельным набором, чтобы блоки могли
    // сослаться на них, не вставляя таблицу целиком.
    if (OKB()) Object.assign(v, OKB().vars(kase.okb, deal.date));

    for (const k of Object.keys(v)) if (v[k] == null) v[k] = '';
    return v;
  }

  /* ================= оценка ================= */

  const num = (v) => {
    const n = Number(v);
    return v === '' || v == null || !isFinite(n) ? null : n;
  };

  /** Цена по договору: заданная отдельно либо сумма сделки. */
  const contractPrice = (deal) => {
    const v = deal.valuation || {};
    return v.gratuitous ? 0 : (num(v.contractPrice) != null ? num(v.contractPrice) : num(deal.amount));
  };

  const marketValue = (deal) => num((deal.valuation || {}).marketValue);

  /**
   * Насколько рыночная стоимость превышает цену сделки. Безвозмездная
   * передача — не «в бесконечность раз», а отдельный случай: кратность там
   * не считается вовсе.
   */
  function valueGap(deal) {
    const market = marketValue(deal);
    if (market == null) return null;
    const price = contractPrice(deal);
    const gap = market - (price || 0);
    const ratio = price > 0 ? market / price : null;
    return { market: market, price: price || 0, gap: gap, ratio: ratio };
  }

  /** «в 1,43 раза» — так кратность пишут в заявлении. */
  const ratioText = (r) => (r == null ? '' :
    (Math.round(r * 100) / 100).toString().replace('.', ','));

  /**
   * Должник в родительном падеже. Склоняем только людей: у организации
   * наименование в кавычках не склоняется, и «ООО «Ромашка»а» — ровно тот
   * мусор, который потом уедет в суд.
   */
  function debtorGen(kase, debtor) {
    if (kase.debtorNameGen) return kase.debtorNameGen;
    if (!debtor) return '';
    if (debtor.kind === 'org') return D.genitiveOrg(partyName(debtor));
    return D.genitiveFio(partyName(debtor));
  }

  /**
   * Как заявитель называет себя в шапке. У гражданина управляющий
   * распоряжается имуществом («финансовый управляющий имуществом должника
   * Ивановой И. И.»), у организации — самой организацией.
   */
  function managerTitle(kase, debtor, proc) {
    const role = proc ? proc.manager : 'арбитражный управляющий';
    const name = debtorGen(kase, debtor);
    if (!name) return role;
    return debtor && debtor.kind === 'org'
      ? role + ' ' + name
      : role + ' имуществом должника ' + name;
  }

  /** Скобка с реквизитами гражданина-должника; пустые поля пропускаются. */
  function debtorBlock(debtor) {
    if (!debtor || debtor.kind === 'org') return '';
    const bits = [];
    if (debtor.birthDate) bits.push(D.dateShort(debtor.birthDate) + ' г.р.');
    if (debtor.birthPlace) bits.push('место рожд.: ' + debtor.birthPlace);
    if (debtor.address) bits.push('адрес рег.: ' + debtor.address);
    if (debtor.snils) bits.push('СНИЛС ' + debtor.snils);
    if (debtor.inn) bits.push('ИНН ' + debtor.inn);
    return bits.length ? '(' + bits.join(', ') + ')' : '';
  }

  /* ================= государственная пошлина ================= */

  /** Цена иска: заданная вручную, иначе рыночная стоимость, иначе сумма сделки. */
  function claimPrice(deal) {
    const f = deal.fee || {};
    if (f.claim !== '' && f.claim != null) return Number(f.claim);
    const v = Number(objectValue(deal));
    return isFinite(v) ? v : 0;
  }

  /**
   * Расчёт пошлины с показом каждого шага: сумму в заявлении подписывает
   * человек, и он должен видеть, из чего она сложилась, а не доверять
   * чёрному ящику.
   *
   * Требований в заявлении обычно два — признать сделку недействительной
   * (пп. 2 п. 1 ст. 333.21 НК РФ, твёрдая ставка) и применить последствия,
   * то есть вернуть имущество (пп. 1, по цене иска). По обособленным спорам
   * в деле о банкротстве платится половина (пп. 9).
   */
  function feeCalc(deal) {
    const f = Object.assign({ scale: 'org', fixedPayer: 'person', withFixed: true, halved: true }, deal.fee || {});
    const claim = claimPrice(deal);
    const steps = [];

    const byValue = D.feeByValue(claim, f.scale);
    const scaleName = (D.FEE_SCALES[f.scale] || D.FEE_SCALES.org).name;
    let sum = byValue.sum;
    steps.push({
      text: 'Требование имущественного характера, подлежащее оценке (пп. 1 п. 1 ст. 333.21 НК РФ), ' +
        'цена иска ' + D.money(claim) + ' руб., ставка для «' + scaleName + '»: ' +
        D.money(byValue.step.base) + (byValue.step.rate
          ? ' руб. + ' + (byValue.step.rate * 100).toString().replace('.', ',') + ' % от суммы свыше ' +
            D.money(byValue.step.over) + ' руб.'
          : ' руб.'),
      sum: byValue.sum
    });

    const fixed = f.withFixed ? (D.FEE_INVALIDATION[f.fixedPayer] || 0) : 0;
    if (fixed) {
      sum += fixed;
      steps.push({
        text: 'Требование о признании сделки недействительной (пп. 2 п. 1 ст. 333.21 НК РФ), ' +
          'ставка для «' + (f.fixedPayer === 'org' ? 'организация' : 'физическое лицо') + '»',
        sum: fixed
      });
    }

    const subtotal = sum;
    let total = subtotal;
    if (f.halved) {
      total = subtotal * D.FEE_BANKRUPTCY_SHARE;
      steps.push({
        text: 'Обособленный спор в деле о банкротстве — 50 % (пп. 9 п. 1 ст. 333.21 НК РФ)',
        sum: total
      });
    }

    const manual = f.manual !== '' && f.manual != null && isFinite(Number(f.manual));
    return {
      claim: claim,
      byValue: byValue.sum,
      fixed: fixed,
      subtotal: subtotal,
      total: manual ? Number(f.manual) : total,
      manual: manual,
      steps: steps
    };
  }

  /** Расчёт одной строкой — для подстановки в текст заявления. */
  function feeText(deal) {
    const c = feeCalc(deal);
    if (c.manual) return D.money(c.total) + ' руб.';
    const parts = c.steps.filter((s) => s.sum !== c.total || !( deal.fee || {}).halved)
      .map((s) => s.text + ' — ' + D.money(s.sum) + ' руб.');
    return parts.join('; ') + (( deal.fee || {}).halved
      ? '; итого с учётом 50 % — ' + D.money(c.total) + ' руб.' : '');
  }

  /* ================= условия ================= */

  /** Контекст для условий блоков: `deal.unequal = true`, `case.procedure = bankruptcy`. */
  function condContext(kase, deal) {
    return {
      deal: {
        unequal: !!deal.flags.unequal,
        harm: !!deal.flags.harm,
        affiliation: !!deal.flags.affiliation,
        preference: !!deal.flags.preference,
        awareness: !!deal.flags.awareness,
        sham: !!deal.flags.sham,
        gratuitous: !!(deal.valuation || {}).gratuitous,
        hasUnequalPerformance: !!deal.flags.unequal,
        type: deal.type,
        objectType: (deal.object || {}).kind,
        performance: deal.performance.state,
        amount: Number(deal.amount) || 0,
        documents: (deal.documents || []).length
      },
      case: {
        procedure: kase.procedure,
        number: kase.number,
        okb: !!(kase.okb && (kase.okb.contracts || []).length)
      }
    };
  }

  const LEAF = /^\s*([A-Za-z_][\w.]*)\s*(>=|<=|!=|=|>|<)\s*(.+?)\s*$/;

  /**
   * Условия из ТЗ (§11) записаны человекочитаемо, поэтому и разбор здесь
   * простой: сравнения, склеенные AND / OR. Никакого eval — выражение
   * приходит из редактируемого шаблона, а исполнять чужой код не нужно.
   */
  function evalCondition(expr, ctx) {
    const s = String(expr || '').trim();
    if (!s) return true;
    if (/\sOR\s/i.test(s)) return s.split(/\s+OR\s+/i).some((p) => evalCondition(p, ctx));
    if (/\sAND\s/i.test(s)) return s.split(/\s+AND\s+/i).every((p) => evalCondition(p, ctx));

    const m = LEAF.exec(s);
    if (!m) return true;              // непонятное условие блок не прячет
    const left = m[1].split('.').reduce((o, k) => (o == null ? o : o[k]), ctx);
    const right = literal(m[3]);
    const op = m[2];

    if (op === '=') return eq(left, right);
    if (op === '!=') return !eq(left, right);
    const a = Number(left), b = Number(right);
    if (!isFinite(a) || !isFinite(b)) return false;
    return op === '>' ? a > b : op === '<' ? a < b : op === '>=' ? a >= b : a <= b;
  }

  function literal(raw) {
    const t = raw.trim().replace(/^['"]|['"]$/g, '');
    if (/^true$/i.test(t)) return true;
    if (/^false$/i.test(t)) return false;
    if (t !== '' && isFinite(Number(t))) return Number(t);
    return t;
  }

  const eq = (a, b) => (typeof b === 'boolean' ? !!a === b : String(a == null ? '' : a) === String(b));

  /* ================= шаблонизатор ================= */

  // Метки незаполненного значения. Управляющие символы выбраны намеренно:
  // в юридическом тексте их не бывает, поэтому подсветка не сработает
  // случайно на данных, введённых пользователем.
  const MISS_A = '\u0001', MISS_B = '\u0002';
  const VAR_RE = /\{\{\s*([A-Z_][A-Z0-9_]*)\s*\}\}/g;

  /**
   * Подстановка переменных. mark=true оставляет метку вокруг незаполненного
   * значения — предпросмотр подсвечивает такие места; в DOCX и на печать
   * идёт прочерк, чтобы документ можно было дозаполнить от руки.
   */
  function render(tpl, vars, mark) {
    return String(tpl || '').replace(VAR_RE, (all, name) => {
      const val = vars[name];
      if (val != null && String(val).trim() !== '') return String(val);
      const label = D.VAR_INDEX.has(name) ? D.VAR_INDEX.get(name).label : name;
      return mark ? MISS_A + label + MISS_B : '__________';
    });
  }

  /** Какие переменные блока остались незаполненными. */
  function missingVars(tpl, vars) {
    const out = [];
    String(tpl || '').replace(VAR_RE, (all, name) => {
      const val = vars[name];
      if ((val == null || String(val).trim() === '') && !out.includes(name)) out.push(name);
      return all;
    });
    return out;
  }

  /* ================= приложения ================= */

  /** «Договор купли-продажи № 15 от 15.04.2025» — строка приложения. */
  function documentLine(doc) {
    const type = D.nameOf(D.DOC_TYPES, doc.type);
    const bits = [doc.name || type];
    if (doc.number) bits.push('№ ' + doc.number);
    if (doc.date) bits.push('от ' + D.dateShort(doc.date));
    let line = bits.join(' ');
    if (doc.description) line += ' — ' + doc.description;
    return line;
  }

  /* ================= счета должника ================= */

  const included = (kase) => (kase.accounts || []).filter((b) => b.include !== false);

  const bankTitle = (b) => b.name || (b.bik ? 'банк, БИК ' + b.bik : 'банк');

  /**
   * Остаток по всем отмеченным банкам.
   *
   * Если счета не разбирались, а сумма вписана одной строкой в реквизитах
   * дела, берётся она: ходатайство должно собираться и без загрузки файлов.
   */
  function accountsTotal(kase) {
    const banks = included(kase);
    if (!banks.length) return num(kase.accountsBalance);
    let total = 0, known = false;
    for (const b of banks) {
      const n = num(b.balance);
      if (n != null) { total += n; known = true; }
    }
    return known ? Math.round(total * 100) / 100 : null;
  }

  /**
   * Перечень банков для текста ходатайства.
   *
   * Остаток печатается только там, где он есть и не нулевой: банк с нулём
   * на счёте называется просто по имени — именно так эта фраза выглядит
   * в готовых ходатайствах, и лишние «0,00» в ней только мешают читать.
   */
  function accountsBanksText(kase) {
    const banks = included(kase);
    if (!banks.length) return kase.accountsBanks || '';
    return banks.map((b) => {
      const n = num(b.balance);
      return bankTitle(b) + (n ? ' — ' + D.money(n) + ' руб.' : '');
    }).join(', ');
  }

  /** Строки приложения: сами сведения ФНС и по справке на каждый банк. */
  function accountsAttachments(kase) {
    const banks = included(kase);
    if (!banks.length) return [];
    const out = [];
    if (kase.accountsMeta) out.push('Сведения об открытых и закрытых счетах должника');
    for (const b of banks) {
      out.push('Сведения об остатке денежных средств на счетах, открытых в ' + bankTitle(b));
    }
    return out;
  }

  /**
   * Разобранные сведения ФНС → банки дела.
   *
   * Уже заведённые банки не затираются: человек мог поправить название или
   * вписать остаток, и повторная загрузка справки не должна это стирать.
   * Совпадение ищем по БИК, а при его отсутствии — по названию.
   */
  function applyFns(db, kase, parsed, fileName) {
    const dir = db.banks || (db.banks = {});
    let added = 0;
    for (const found of parsed.banks) {
      let bank = (kase.accounts || []).find((b) => b.bik && b.bik === found.bik);
      if (!bank) {
        bank = newBank({ bik: found.bik, source: 'fns' });
        kase.accounts.push(bank);
        added++;
      }
      if (!bank.inn) bank.inn = found.inn || '';
      if (!bank.name) bank.name = ACC() ? ACC().bankName(found.bik, found.inn, dir, found.name) : (found.name || '');
      bank.open = found.open.slice();
      bank.closed = found.closed.slice();
    }
    kase.accountsMeta = {
      file: fileName || '', loadedAt: now(),
      pages: parsed.pages, unreadable: parsed.unreadable.slice(),
      open: parsed.banks.reduce((n, b) => n + b.open.length, 0),
      closed: parsed.closed
    };
    return added;
  }

  /**
   * Разобранная справка банка → банк дела.
   *
   * Банк ищем по БИК из самой справки, затем по названию из имени файла.
   * Не нашли — заводим новый: справка пришла, значит счёт в этом банке
   * есть, даже если страница сведений ФНС с ним не прочиталась.
   */
  function applyStatement(db, kase, parsed, fileName) {
    const dir = db.banks || (db.banks = {});
    const fromFile = ACC() ? ACC().nameFromFile(fileName) : '';
    const norm = (s) => String(s || '').toLowerCase().replace(/[«»"'()\s.-]/g, '');

    let bank = parsed.bik ? (kase.accounts || []).find((b) => b.bik === parsed.bik) : null;
    if (!bank && fromFile) {
      bank = (kase.accounts || []).find((b) => b.name && (
        norm(b.name).includes(norm(fromFile)) || norm(fromFile).includes(norm(b.name))));
    }
    if (!bank) {
      bank = newBank({ bik: parsed.bik || '', source: 'statement' });
      kase.accounts.push(bank);
    }
    if (!bank.bik && parsed.bik) bank.bik = parsed.bik;
    if (!bank.name) bank.name = ACC() ? ACC().bankName(bank.bik, bank.inn, dir, fromFile) : fromFile;
    bank.statement = fileName || '';
    if (parsed.total != null) {
      bank.balance = String(Math.round(parsed.total * 100) / 100);
      bank.balanceNote = parsed.method;
    } else {
      bank.balanceNote = '';
    }
    // Название, введённое человеком, запоминаем: в следующем деле тот же
    // БИК подпишется сам.
    if (bank.bik && bank.name) dir[bank.bik] = bank.name;
    return bank;
  }

  const ACC = () => globalThis.ZAccounts;

  /** Сквозной список приложений: нумерация пересобирается при каждом изменении (§16). */
  function attachments(deal, kase, kind) {
    const own = (deal.documents || []).filter((d) => d.attach !== false).map(documentLine);
    // Ходатайство об отсрочке держится на банковских справках, и они
    // перечисляются в нём сами: список банков уже собран, дублировать его
    // руками в документах сделки — лишняя работа и лишний повод разойтись.
    if (kind === 'petition' && kase) return accountsAttachments(kase).concat(own);
    return own;
  }

  /**
   * Выбор оснований — единственный источник правды о том, какие правовые
   * блоки нужны. Флаги пересчитываются из него, а не заводятся отдельно:
   * иначе они рано или поздно разойдутся с тем, что человек отметил.
   */
  function setGrounds(deal, ids) {
    deal.grounds = (ids || []).slice();
    for (const g of D.GROUNDS) deal.flags[g.id] = deal.grounds.includes(g.id);
  }

  const groundNames = (deal) => (deal.grounds || [])
    .map((id) => D.byId(D.GROUNDS, id))
    .filter(Boolean);

  /* ================= блоки заявления ================= */

  /** Библиотека = стандартные блоки (с учётом правок) + пользовательские. */
  function library(db, kind) {
    const has = (id) => Object.prototype.hasOwnProperty.call(db.edits || {}, id);
    const std = D.BLOCKS.map((b) => Object.assign({}, b, {
      kinds: b.kinds || ['statement'],
      template: has(b.id) ? db.edits[b.id] : b.template,
      edited: has(b.id)
    }));
    const own = (db.customBlocks || []).map((b) =>
      Object.assign({ custom: true, kinds: b.kinds || ['statement'] }, b));
    const all = std.concat(own);
    if (!kind) return all;

    // Порядок задан видом документа; всё, что в его перечень не попало,
    // дописывается в конец — так свой блок не теряется.
    const order = (D.byId(D.DOC_KINDS, kind) || {}).blocks || [];
    const mine = all.filter((b) => (b.kinds || ['statement']).includes(kind));
    const rank = (b) => {
      const at = order.indexOf(b.id);
      return at < 0 ? order.length : at;
    };
    return mine.slice().sort((a, b) => rank(a) - rank(b));
  }

  /**
   * Состав заявления. При первом заходе строится из библиотеки: обязательные
   * блоки включены, условные — по фактам сделки. Дальше решает пользователь,
   * и его выбор не перетирается.
   */
  function statementBlocks(db, kase, deal, statement) {
    const st = statement || mainStatement(deal);
    const lib = library(db, st.kind);
    const ctx = condContext(kase, deal);
    const known = new Map(lib.map((b) => [b.id, b]));

    if (!st.blocks.length) {
      st.blocks = lib.map((b, i) => ({
        id: b.id, order: i,
        enabled: b.required ? true : (b.condition ? evalCondition(b.condition, ctx) : true),
        text: null
      }));
    } else {
      // Новый блок в библиотеке (например, свой) должен появиться в конце,
      // а не исчезнуть молча.
      const have = new Set(st.blocks.map((x) => x.id));
      let order = st.blocks.length;
      for (const b of lib) {
        if (have.has(b.id)) continue;
        st.blocks.push({ id: b.id, order: order++, enabled: !!b.required, text: null });
      }
      st.blocks = st.blocks.filter((x) => known.has(x.id));
    }

    st.blocks.sort((a, b) => a.order - b.order);
    st.blocks.forEach((x, i) => { x.order = i; });

    return st.blocks.map((x) => {
      const b = known.get(x.id);
      return {
        ref: x,
        id: b.id, name: b.name, description: b.description || '', group: b.group || 'Прочее',
        align: b.align || 'justify', bold: !!b.bold, required: !!b.required,
        condition: b.condition || '', auto: b.auto || '', custom: !!b.custom, edited: !!b.edited,
        template: x.text != null ? x.text : b.template,
        overridden: x.text != null,
        enabled: !!x.enabled,
        available: b.condition ? evalCondition(b.condition, ctx) : true
      };
    });
  }

  /**
   * Готовый документ: массив абзацев с выравниванием. На этом виде строятся
   * и предпросмотр, и печать, и DOCX — три представления одного результата.
   */
  function buildDocument(db, kase, deal, opts) {
    const mark = !!(opts && opts.mark);
    const st = (opts && opts.statement) || mainStatement(deal);

    // В свободном режиме собирать нечего: текст уже написан руками. Через эту
    // же ветку проходят и DOCX, и листы для печати, и версии — ни один из них
    // о режиме не знает и знать не должен.
    if (isFree(st)) return st.free.items.map((it) => Object.assign({}, it));

    const vars = context(db, kase, deal, st.kind);
    const out = [];

    for (const b of statementBlocks(db, kase, deal, st)) {
      if (!b.enabled) continue;
      const lines = render(b.template, vars, mark).split('\n').map((s) => s.replace(/[ \t]+$/, ''));
      let first = true;
      for (const line of lines) {
        // Пустые строки шаблона — разделители внутри блока. Пустой абзац
        // в начале и в конце документа выглядел бы дырой, поэтому в вывод
        // попадают только те, между которыми есть текст.
        if (line.trim() === '') {
          if (!first && out.length && out[out.length - 1].kind === 'p' && out[out.length - 1].text.trim() !== '') out.push({ kind: 'p', text: '', align: b.align, bold: b.bold, blockId: b.id });
          continue;
        }
        out.push({ kind: 'p', text: line, align: b.align, bold: b.bold, blockId: b.id, first: first });
        first = false;
      }
      if (out.length && out[out.length - 1].kind === 'p' && out[out.length - 1].text.trim() === '') out.pop();

      const table = autoTable(b, kase, deal);
      if (table) out.push(table);
    }
    return out;
  }

  /** Блок с пометкой auto подставляет не текст, а таблицу по отчёту ОКБ. */
  function autoTable(block, kase, deal) {
    if (!OKB() || !kase.okb) return null;
    if (block.auto === 'table_insolvency') return OKB().tableInsolvency(kase.okb, { limit: 30 });
    if (block.auto === 'table_overdue') return OKB().tableOverdue(kase.okb, deal.date, { limit: 30 });
    return null;
  }

  /** Плоский текст документа — для версий и сравнения. */
  const documentText = (db, kase, deal, st) =>
    buildDocument(db, kase, deal, { mark: false, statement: st })
      .map((p) => (p.kind === 'table'
        ? [p.head.join(' | ')].concat(p.rows.map((r) => r.join(' | ')),
          p.total ? [p.total.join(' | ')] : []).join('\n')
        : p.text))
      .join('\n');

  /* ================= проверка ================= */

  /**
   * Ошибки не дают сформировать документ, предупреждения — только сигналят.
   * Все проверки — обычные правила, никакой «оценки перспектив» (§28).
   */
  function validate(db, kase, deal, statement) {
    const st = statement || mainStatement(deal);
    const errors = [], warnings = [];
    const debtor = debtorOf(kase);
    const cp = counterpartyOf(kase, deal);
    const req = (cond, field, where) => { if (!cond) errors.push({ field, where }); };

    // Свободный текст проверять по анкете бессмысленно: он больше не следует
    // за данными дела, и «не заполнено» относилось бы к позапрошлой версии.
    // Остаётся одно, что можно сказать честно: документ непустой.
    if (isFree(st)) {
      const empty = !st.free.items.some((it) => it.kind !== 'p' || String(it.text || '').trim());
      if (empty) errors.push({ field: 'Текст документа', where: 'builder' });
      return {
        errors, warnings, missingVars: [], free: true,
        ok: errors.length === 0
      };
    }

    req(kase.number, 'Номер дела', 'case');
    req(kase.court, 'Наименование суда', 'case');
    req(partyName(debtor), 'Наименование должника', 'case');
    req(kase.managerName || db.profile.name, 'ФИО финансового управляющего', 'case');
    req(deal.date, 'Дата сделки', 'deal');
    req(deal.amount !== '' && deal.amount != null, 'Сумма сделки', 'deal');
    req(cp && partyName(cp), 'Контрагент по сделке', 'deal');

    const blocks = statementBlocks(db, kase, deal, st);
    if (!blocks.some((b) => b.enabled)) errors.push({ field: 'Не выбран ни один блок документа', where: 'builder' });

    // Логические проверки (§14)
    const perfDate = deal.performance.date;
    const base = deal.contractDate || deal.date;
    if (perfDate && base && perfDate < base) {
      warnings.push('Дата исполнения сделки (' + D.dateShort(perfDate) +
        ') раньше даты заключения договора (' + D.dateShort(base) + ').');
    }
    if (deal.date && kase.caseStartDate && deal.date > kase.caseStartDate) {
      warnings.push('Сделка совершена после возбуждения дела о банкротстве — периоды подозрительности ' +
        'по статье 61.2 считаются от даты принятия заявления.');
    }
    if (deal.contractDate && deal.date && deal.contractDate > deal.date) {
      warnings.push('Дата договора позже даты сделки.');
    }
    const o = deal.object || {};
    if (o.kind === 'money' && o.sum !== '' && deal.amount !== '' && Number(o.sum) !== Number(deal.amount)) {
      warnings.push('Сумма сделки (' + D.money(deal.amount) + ' руб.) отличается от суммы платежа (' +
        D.money(o.sum) + ' руб.).');
    }

    const on = (id) => blocks.some((b) => b.id === id && b.enabled);
    if ((deal.grounds || []).includes('unequal') && marketValue(deal) == null) {
      warnings.push('Оспаривание по пункту 1 статьи 61.2 держится на рыночной стоимости, ' +
        'но она не заполнена: внесите её из решения об оценке.');
    }
    const vg = valueGap(deal);
    if (vg && !(deal.valuation || {}).gratuitous && vg.gap <= 0) {
      warnings.push('Рыночная стоимость не превышает цену договора — неравноценность из этих ' +
        'цифр не следует.');
    }
    if (on('affiliation') && !(deal.affiliationGrounds || []).length) {
      warnings.push('Выбран блок «Заинтересованность сторон», но основания заинтересованности не указаны.');
    }
    if (on('preference') && !(deal.preferenceGrounds || []).length) {
      warnings.push('Выбран блок «Предпочтительное удовлетворение», но основания предпочтения не указаны.');
    }
    if (on('attachments') && !attachments(deal, kase, st.kind).length) {
      warnings.push('Блок «Приложения» включён, но к сделке не приложено ни одного документа.');
    }
    if (st.kind === 'petition') {
      const banks = included(kase);
      const blank = banks.filter((b) => num(b.balance) == null);
      if (!banks.length && !kase.accountsBalance) {
        warnings.push('Ходатайство об отсрочке опирается на остатки по счетам, а счета не заведены. ' +
          'Загрузите сведения ФНС или впишите остаток вручную.');
      } else if (blank.length) {
        warnings.push('Остаток не указан по ' + blank.length + ' ' +
          D.plural(blank.length, 'банку', 'банкам', 'банкам') + ': ' +
          blank.map(bankTitle).join(', ') + '.');
      }
      const bad = (kase.accountsMeta && kase.accountsMeta.unreadable) || [];
      if (bad.length) {
        warnings.push('В сведениях ФНС не прочитаны страницы ' + bad.join(', ') +
          ' — часть банков могла не попасть в список. Проверьте по файлу.');
      }
    }

    // Незаполненные переменные включённых блоков
    const vars = context(db, kase, deal, st.kind);
    const missing = new Set();
    for (const b of blocks) if (b.enabled) for (const n of missingVars(b.template, vars)) missing.add(n);

    return { errors, warnings, missingVars: [...missing], free: false, ok: errors.length === 0 };
  }

  /* ================= версии ================= */

  function saveVersion(db, kase, deal, statement, note) {
    const st = statement || mainStatement(deal);
    st.seq = (st.seq || 0) + 1;
    st.versions.push({
      id: uid(), no: st.seq, createdAt: now(), note: note || '',
      text: documentText(db, kase, deal, st),
      blocks: JSON.parse(JSON.stringify(st.blocks))
    });
    return st.versions[st.versions.length - 1];
  }

  function restoreVersion(statement, versionId) {
    const v = statement.versions.find((x) => x.id === versionId);
    if (!v) return false;
    statement.blocks = JSON.parse(JSON.stringify(v.blocks));
    return true;
  }

  /**
   * Построчное сравнение двух версий. Наибольшая общая подпоследовательность:
   * строки заявления длинные и почти не повторяются, поэтому простой LCS
   * даёт понятный человеку результат.
   */
  function diffLines(aText, bText) {
    const a = String(aText).split('\n'), b = String(bText).split('\n');
    const n = a.length, m = b.length;
    const w = m + 1;
    const dp = new Uint32Array((n + 1) * w);
    for (let i = n - 1; i >= 0; i--) {
      for (let j = m - 1; j >= 0; j--) {
        dp[i * w + j] = a[i] === b[j]
          ? dp[(i + 1) * w + j + 1] + 1
          : Math.max(dp[(i + 1) * w + j], dp[i * w + j + 1]);
      }
    }
    const out = [];
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) { out.push({ op: ' ', text: a[i] }); i++; j++; }
      else if (dp[(i + 1) * w + j] >= dp[i * w + j + 1]) { out.push({ op: '-', text: a[i] }); i++; }
      else { out.push({ op: '+', text: b[j] }); j++; }
    }
    while (i < n) out.push({ op: '-', text: a[i++] });
    while (j < m) out.push({ op: '+', text: b[j++] });
    return out;
  }

  /* ================= копирование сделки ================= */

  /** «Создать на основе этой сделки» (§18): стороны и структура сохраняются. */
  function cloneDeal(deal) {
    const copy = JSON.parse(JSON.stringify(deal));
    copy.id = uid();
    copy.createdAt = copy.updatedAt = now();
    // Реквизиты конкретной сделки — то немногое, что заведомо другое.
    copy.number = '';
    copy.date = '';
    copy.contractDate = '';
    copy.documents = [];
    for (const st of copy.statements) {
      st.id = uid();
      st.versions = [];
      st.seq = 0;
      st.status = 'draft';
    }
    return copy;
  }

  globalThis.ZStore = {
    KEY, SCHEMA, uid, now,
    newDb, newCase, newParty, newDeal, newObject, newDocument, newStatement,
    kindOf, findStatement, mainStatement, setGrounds, groundNames,
    load, save, migrate,
    partyName, partyShort, partyInn, partyOgrn, partyAddress, partyRequisites,
    findParty, debtorOf, counterpartyOf,
    objectDescription, objectValue, dealTypeName, dealTypeGen, periodBefore,
    contractPrice, marketValue, valueGap, ratioText,
    claimPrice, feeCalc, feeText, debtorGen, managerTitle, debtorBlock,
    context, condContext, evalCondition, render, missingVars,
    documentLine, attachments,
    newBank, included, bankTitle, accountsTotal, accountsBanksText, accountsAttachments,
    applyFns, applyStatement,
    library, statementBlocks, buildDocument, documentText, autoTable,
    isFree, enterFree, exitFree, newPara,
    validate, saveVersion, restoreVersion, diffLines, cloneDeal,
    MISS_A, MISS_B
  };
})();
</script>
<script>/*
 * Выгрузка готового заявления: DOCX и раскладка листов A4 для печати в PDF.
 *
 * DOCX собирается вручную, без библиотек. Формат .docx — это ZIP из
 * нескольких XML-файлов, и написать их оказывается дешевле, чем тащить
 * в офлайновую страницу мегабайт стороннего кода. Сжатие не используется:
 * заявление весит десятки килобайт, а «сохранение без сжатия» — легальный
 * режим ZIP, который Word открывает наравне с обычным.
 *
 * PDF получается печатью: листы раскладываются здесь по фактическим высотам
 * абзацев, поэтому в файле не появляется ни срезанного текста, ни пустот,
 * а нумерация страниц совпадает с тем, что видно в предпросмотре.
 */
(function () {
  'use strict';

  const NS_W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const NS_R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const NS_CT = 'http://schemas.openxmlformats.org/package/2006/content-types';
  const NS_REL = 'http://schemas.openxmlformats.org/package/2006/relationships';

  const enc = new TextEncoder();
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  /* ================= ZIP ================= */

  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[i] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  /** Дата и время в формате MS-DOS — два 16-битных поля заголовка ZIP. */
  function dosStamp(d) {
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    return { time, date };
  }

  /**
   * Собирает ZIP из [{name, data}] без сжатия (метод 0).
   * Имена частей .docx — только ASCII, поэтому флаг UTF-8 роли не играет,
   * но выставлен: так архив корректен и для внешних инструментов.
   */
  function zip(files) {
    const stamp = dosStamp(new Date());
    const parts = [];
    const central = [];
    let offset = 0;

    for (const f of files) {
      const nameBytes = enc.encode(f.name);
      const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
      const crc = crc32(data);

      const local = new Uint8Array(30 + nameBytes.length);
      const lv = new DataView(local.buffer);
      lv.setUint32(0, 0x04034B50, true);
      lv.setUint16(4, 20, true);          // версия для распаковки
      lv.setUint16(6, 0x0800, true);      // имена в UTF-8
      lv.setUint16(8, 0, true);           // метод: без сжатия
      lv.setUint16(10, stamp.time, true);
      lv.setUint16(12, stamp.date, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, data.length, true);
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);
      local.set(nameBytes, 30);

      parts.push(local, data);

      const cd = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(cd.buffer);
      cv.setUint32(0, 0x02014B50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, stamp.time, true);
      cv.setUint16(14, stamp.date, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint32(42, offset, true);
      cd.set(nameBytes, 46);
      central.push(cd);

      offset += local.length + data.length;
    }

    const cdSize = central.reduce((n, c) => n + c.length, 0);
    const end = new Uint8Array(22);
    const ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054B50, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);

    const all = parts.concat(central, [end]);
    const total = all.reduce((n, p) => n + p.length, 0);
    const out = new Uint8Array(total);
    let at = 0;
    for (const p of all) { out.set(p, at); at += p.length; }
    return out;
  }

  /* ================= DOCX ================= */

  // Размеры в твипах (1/20 пункта). Поля — по ГОСТ Р 7.0.97 для документов,
  // подаваемых в суд: слева 30 мм под подшивку, справа 15, сверху и снизу 20.
  const PAGE = { w: 11906, h: 16838, top: 1134, right: 850, bottom: 1134, left: 1701 };
  const INDENT = 709;          // абзацный отступ 1,25 см
  const LINE = 360;            // полуторный интервал

  const ALIGN = { justify: 'both', center: 'center', right: 'right', left: 'left' };

  function paragraphXml(p) {
    const jc = ALIGN[p.align] || 'both';
    // Красная строка нужна только в связном тексте: в шапке, заголовке
    // и подписи она разъезжается.
    const indent = jc === 'both' || jc === 'left' ? `<w:ind w:firstLine="${INDENT}"/>` : '';
    const pPr = `<w:pPr><w:spacing w:after="0" w:line="${LINE}" w:lineRule="auto"/>` +
      `<w:jc w:val="${jc}"/>${indent}</w:pPr>`;

    if (!p.text.trim()) return `<w:p>${pPr}</w:p>`;

    const rPr = p.bold ? '<w:rPr><w:b/></w:rPr>' : '';
    const runs = String(p.text).split('\t')
      .map((chunk, i) => (i ? '<w:r><w:tab/></w:r>' : '') +
        `<w:r>${rPr}<w:t xml:space="preserve">${esc(chunk)}</w:t></w:r>`)
      .join('');
    return `<w:p>${pPr}${runs}</w:p>`;
  }

  const CELL_ALIGN = { left: 'left', right: 'right', center: 'center' };

  /**
   * Таблица DOCX. Ширины колонок заданы долями полосы набора: Word умеет
   * авторазметку, но тогда узкая графа «Дней» растягивается на треть листа.
   * Шапка помечена tblHeader — при переносе на следующий лист она повторится.
   */
  function tableXml(t) {
    const width = PAGE.w - PAGE.left - PAGE.right;
    const weights = t.head.map((h, i) => (t.align && t.align[i] === 'left' ? 3 : 1));
    const totalWeight = weights.reduce((a, b) => a + b, 0);
    const widths = weights.map((w) => Math.round(width * w / totalWeight));

    const cell = (text, i, opts) => {
      const jc = CELL_ALIGN[(t.align || [])[i]] || 'left';
      const rPr = opts && opts.bold ? '<w:rPr><w:b/></w:rPr>' : '';
      return `<w:tc><w:tcPr><w:tcW w:w="${widths[i]}" w:type="dxa"/></w:tcPr>` +
        `<w:p><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/>` +
        `<w:jc w:val="${jc}"/></w:pPr>` +
        `<w:r>${rPr}<w:t xml:space="preserve">${esc(text)}</w:t></w:r></w:p></w:tc>`;
    };

    const row = (cells, opts) =>
      '<w:tr>' + (opts && opts.header ? '<w:trPr><w:tblHeader/></w:trPr>' : '') +
      cells.map((c, i) => cell(c, i, opts)).join('') + '</w:tr>';

    const borders = ['top', 'left', 'bottom', 'right', 'insideH', 'insideV']
      .map((k) => `<w:${k} w:val="single" w:sz="4" w:space="0" w:color="000000"/>`).join('');

    return '<w:tbl>' +
      `<w:tblPr><w:tblW w:w="${width}" w:type="dxa"/><w:tblBorders>${borders}</w:tblBorders>` +
      '<w:tblCellMar><w:left w:w="57" w:type="dxa"/><w:right w:w="57" w:type="dxa"/></w:tblCellMar>' +
      '</w:tblPr>' +
      '<w:tblGrid>' + widths.map((w) => `<w:gridCol w:w="${w}"/>`).join('') + '</w:tblGrid>' +
      row(t.head, { header: true, bold: true }) +
      t.rows.map((r) => row(r)).join('') +
      (t.total ? row(t.total, { bold: true }) : '') +
      '</w:tbl>' +
      // После таблицы Word требует абзац, иначе следующая таблица слипается
      // с предыдущей в одну.
      '<w:p><w:pPr><w:spacing w:after="0"/></w:pPr></w:p>';
  }

  function documentXml(paras) {
    const body = paras.map((p) => (p.kind === 'table' ? tableXml(p) : paragraphXml(p))).join('');
    const sect = '<w:sectPr>' +
      '<w:footerReference w:type="default" r:id="rId2"/>' +
      `<w:pgSz w:w="${PAGE.w}" w:h="${PAGE.h}"/>` +
      `<w:pgMar w:top="${PAGE.top}" w:right="${PAGE.right}" w:bottom="${PAGE.bottom}" ` +
      `w:left="${PAGE.left}" w:header="708" w:footer="708" w:gutter="0"/>` +
      '</w:sectPr>';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      `<w:document xmlns:w="${NS_W}" xmlns:r="${NS_R}"><w:body>${body}${sect}</w:body></w:document>`;
  }

  const STYLES_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    `<w:styles xmlns:w="${NS_W}">` +
    '<w:docDefaults><w:rPrDefault><w:rPr>' +
    '<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>' +
    '<w:sz w:val="28"/><w:szCs w:val="28"/><w:lang w:val="ru-RU"/>' +
    '</w:rPr></w:rPrDefault>' +
    `<w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="${LINE}" w:lineRule="auto"/></w:pPr></w:pPrDefault>` +
    '</w:docDefaults>' +
    '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>' +
    '</w:styles>';

  // Номер страницы в колонтитуле — поле PAGE: Word пересчитывает его сам,
  // и нумерация остаётся верной после любой правки текста.
  const FOOTER_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    `<w:ftr xmlns:w="${NS_W}" xmlns:r="${NS_R}">` +
    '<w:p><w:pPr><w:jc w:val="center"/></w:pPr>' +
    '<w:r><w:fldChar w:fldCharType="begin"/></w:r>' +
    '<w:r><w:instrText xml:space="preserve"> PAGE </w:instrText></w:r>' +
    '<w:r><w:fldChar w:fldCharType="separate"/></w:r>' +
    '<w:r><w:t>1</w:t></w:r>' +
    '<w:r><w:fldChar w:fldCharType="end"/></w:r>' +
    '</w:p></w:ftr>';

  const CONTENT_TYPES =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    `<Types xmlns="${NS_CT}">` +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
    '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
    '<Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/>' +
    '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>' +
    '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>' +
    '</Types>';

  const ROOT_RELS =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    `<Relationships xmlns="${NS_REL}">` +
    `<Relationship Id="rId1" Type="${NS_R}/officeDocument" Target="word/document.xml"/>` +
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>' +
    `<Relationship Id="rId3" Type="${NS_R}/extended-properties" Target="docProps/app.xml"/>` +
    '</Relationships>';

  const DOC_RELS =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    `<Relationships xmlns="${NS_REL}">` +
    `<Relationship Id="rId1" Type="${NS_R}/styles" Target="styles.xml"/>` +
    `<Relationship Id="rId2" Type="${NS_R}/footer" Target="footer1.xml"/>` +
    '</Relationships>';

  function coreXml(title) {
    const iso = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" ' +
      'xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" ' +
      'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
      `<dc:title>${esc(title)}</dc:title>` +
      `<dcterms:created xsi:type="dcterms:W3CDTF">${iso}</dcterms:created>` +
      `<dcterms:modified xsi:type="dcterms:W3CDTF">${iso}</dcterms:modified>` +
      '</cp:coreProperties>';
  }

  const APP_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties">' +
    '<Application>Конструктор заявлений</Application></Properties>';

  /** Готовый .docx как Uint8Array. */
  function docxBytes(paras, title) {
    return zip([
      { name: '[Content_Types].xml', data: CONTENT_TYPES },
      { name: '_rels/.rels', data: ROOT_RELS },
      { name: 'docProps/core.xml', data: coreXml(title || 'Заявление') },
      { name: 'docProps/app.xml', data: APP_XML },
      { name: 'word/_rels/document.xml.rels', data: DOC_RELS },
      { name: 'word/document.xml', data: documentXml(paras) },
      { name: 'word/styles.xml', data: STYLES_XML },
      { name: 'word/footer1.xml', data: FOOTER_XML }
    ]);
  }

  /* ================= листы A4 для печати ================= */

  const MM = 3.7795275591;                     // px в мм при 96 dpi
  const SHEET = { w: 210, h: 297, top: 20, right: 15, bottom: 20, left: 30 };
  const CONTENT_H = SHEET.h - SHEET.top - SHEET.bottom;

  const paraHtml = (p, i) =>
    `<p class="dp ${p.align}${p.bold ? ' b' : ''}" data-i="${i}">${esc(p.text) || '&nbsp;'}</p>`;

  const cellsHtml = (cells, align, tag) => cells
    .map((c, i) => `<${tag} class="${(align || [])[i] || 'left'}">${esc(c)}</${tag}>`).join('');

  /** Таблица целиком — для предпросмотра, где резать по страницам не нужно. */
  const tableHtml = (t) =>
    '<table class="dt"><thead><tr>' + cellsHtml(t.head, t.align, 'th') + '</tr></thead><tbody>' +
    t.rows.map((r) => '<tr>' + cellsHtml(r, t.align, 'td') + '</tr>').join('') +
    (t.total ? '<tr class="tot">' + cellsHtml(t.total, t.align, 'td') + '</tr>' : '') +
    '</tbody></table>' + (t.note ? `<p class="dnote">${esc(t.note)}</p>` : '');

  /**
   * Материал документа, разложенный на неделимые куски: абзац или одна
   * строка таблицы. Строка — минимальная единица переноса, поэтому длинная
   * таблица разрывается между листами, а не вылезает за обрез целиком.
   */
  function flow(paras) {
    const items = [];
    paras.forEach((p, i) => {
      if (p.kind !== 'table') { items.push({ type: 'p', p: p, i: i }); return; }
      const rows = p.rows.concat(p.total ? [p.total] : []);
      rows.forEach((r, n) => items.push({
        type: 'row', table: p, cells: r, first: n === 0,
        total: !!p.total && n === rows.length - 1
      }));
      if (p.note) items.push({ type: 'p', p: { text: p.note, align: 'left', bold: false, note: true }, i: i });
    });
    return items;
  }

  /** Один кусок в разметку. Строка таблицы меряется вместе с шапкой. */
  function itemHtml(item, withHead) {
    if (item.type === 'p') {
      return item.p.note
        ? `<p class="dnote">${esc(item.p.text)}</p>`
        : paraHtml(item.p, item.i);
    }
    const t = item.table;
    return '<table class="dt"><thead><tr>' +
      cellsHtml(t.head, t.align, 'th') + '</tr></thead><tbody><tr' +
      (item.total ? ' class="tot"' : '') + '>' + cellsHtml(item.cells, t.align, 'td') +
      '</tr></tbody></table>';
  }

  /**
   * Раскладка по листам. Высоты не прикидываются, а измеряются: абзацы
   * рендерятся в скрытом контейнере той же ширины, и только потом
   * распределяются по страницам. Иначе на длинных заявлениях накапливается
   * ошибка и последняя строка листа уезжает под обрез.
   */
  function buildSheets(paras, opts) {
    const doc = (opts && opts.document) || globalThis.document;
    const items = flow(paras);

    const box = doc.createElement('div');
    box.className = 'docmeasure';
    box.style.width = (SHEET.w - SHEET.left - SHEET.right) + 'mm';
    // Каждый кусок меряется отдельной обёрткой: у строки таблицы своя высота,
    // а шапка добавляется к первой строке на листе, и её высоту надо знать.
    box.innerHTML = items.map((it) => '<div class="mi">' + itemHtml(it) + '</div>').join('');
    doc.body.appendChild(box);

    const heights = [...box.children].map((n) => n.getBoundingClientRect().height);
    // Высота одной только шапки таблицы — цена переноса на новый лист.
    const headBox = doc.createElement('div');
    headBox.className = 'docmeasure';
    headBox.style.width = (SHEET.w - SHEET.left - SHEET.right) + 'mm';
    headBox.innerHTML = items.map((it) => '<div class="mi">' +
      (it.type === 'row' ? '<table class="dt"><thead><tr>' +
        cellsHtml(it.table.head, it.table.align, 'th') + '</tr></thead></table>' : '') + '</div>').join('');
    doc.body.appendChild(headBox);
    const headHeights = [...headBox.children].map((n) => n.getBoundingClientRect().height);

    box.remove();
    headBox.remove();

    const limit = CONTENT_H * MM;
    const pages = [[]];
    let used = 0;

    for (let i = 0; i < items.length; i++) {
      const isFirstOnPage = pages[pages.length - 1].length === 0;
      // Строке таблицы, открывающей лист, нужна ещё и шапка.
      const extra = items[i].type === 'row' && isFirstOnPage ? headHeights[i] : 0;
      const h = heights[i] + (items[i].type === 'row' && !items[i].first ? -headHeights[i] : 0);
      if (used > 0 && used + h + extra > limit) { pages.push([]); used = extra; }
      pages[pages.length - 1].push(i);
      used += h + (pages[pages.length - 1].length === 1 ? extra : 0);
    }

    const total = pages.length;
    return pages.map((idx, n) =>
      '<section class="sheet"><div class="sheetbody">' + renderPage(items, idx) + '</div>' +
      `<div class="sheetnum">${n + 1} из ${total}</div></section>`).join('');
  }

  /** Соседние строки одной таблицы собираются обратно в одну таблицу с шапкой. */
  function renderPage(items, idx) {
    const out = [];
    let open = null;
    const close = () => {
      if (!open) return;
      out.push('<table class="dt"><thead><tr>' + cellsHtml(open.t.head, open.t.align, 'th') +
        '</tr></thead><tbody>' + open.rows.join('') + '</tbody></table>');
      open = null;
    };

    for (const i of idx) {
      const item = items[i];
      if (item.type === 'row') {
        if (!open || open.t !== item.table) { close(); open = { t: item.table, rows: [] }; }
        open.rows.push('<tr' + (item.total ? ' class="tot"' : '') + '>' +
          cellsHtml(item.cells, item.table.align, 'td') + '</tr>');
      } else {
        close();
        out.push(itemHtml(item));
      }
    }
    close();
    return out.join('');
  }

  /* ================= сохранение файла ================= */

  function download(bytes, filename, mime) {
    const blob = new Blob([bytes], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  /** Имя файла без символов, запрещённых в Windows. */
  const safeName = (s) => String(s || 'Заявление').replace(/[\\/:*?"<>|]/g, ' ')
    .replace(/\s+/g, ' ').trim().slice(0, 90) || 'Заявление';

  globalThis.ZDoc = {
    zip, crc32, docxBytes, documentXml, tableXml, buildSheets, tableHtml, flow, download, safeName,
    SHEET, CONTENT_H, MM,
    DOCX_MIME: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
  };
})();
</script>
<script>/*
 * Прототип СделкоСпара по концепту «один путь от сделки до документа».
 *
 *   Главная: «Новая сделка» или «Открыть сохранённую».
 *   1 Данные сделки → 2 Основание → 3 Обстоятельства → 4 Доказательства
 *   → 5 Проверка → 6 Документ сформирован.
 *
 * Движок настоящий, тот же, что в рабочем приложении: шаблоны, склонение,
 * расчёт пошлины, сборка DOCX. Поэтому в конце скачивается настоящее
 * заявление, а не картинка.
 *
 * Обстоятельства спрашиваются вопросами «да / нет / неизвестно», и текст
 * для заявления собирается из ответов сам. Заинтересованность
 * и осведомлённость контрагента — тоже ответы на вопросы, а не отдельные
 * основания, которые надо знать заранее.
 *
 * Данные прототипа лежат отдельно от рабочего приложения, под своим ключом:
 * он не видит настоящих дел и не может их испортить.
 */
(function () {
  'use strict';

  const D = globalThis.ZData;
  const S = globalThis.ZStore;
  const X = globalThis.ZDoc;
  const IMP = globalThis.ZImport;

  /* ================= хранение ================= */

  const KEY = 'sdelkospar-proto';

  function load() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { /* приватный режим */ }
    let db = S.newDb();
    if (raw) { try { db = S.migrate(JSON.parse(raw)); } catch (e) { /* битая копия — начинаем с чистого */ } }
    db.ui = Object.assign({ theme: 'system', lastBackup: null, savedAt: null }, db.ui || {});
    return db;
  }

  let db = load();
  let timer = null;

  function writeNow() {
    clearTimeout(timer);
    const d = deal();
    if (d) d.updatedAt = new Date().toISOString();
    db.ui.savedAt = new Date().toISOString();
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* ничего */ }
    savedState('ok');
  }
  function save() { savedState('busy'); clearTimeout(timer); timer = setTimeout(writeNow, 350); }
  window.addEventListener('beforeunload', writeNow);

  /* ================= служебное ================= */

  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const attr = (s) => esc(s).replace(/'/g, '&#39;');
  const normMoney = (s) => String(s).replace(/\s| /g, '').replace(',', '.');
  const hhmm = (iso) => new Date(iso).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  function whenSaved(iso) {
    if (!iso) return '';
    const d = new Date(iso), now = new Date();
    const day = (x) => Date.UTC(x.getFullYear(), x.getMonth(), x.getDate());
    const diff = Math.round((day(now) - day(d)) / 86400000);
    return diff === 0 ? 'сегодня в ' + hhmm(iso) : diff === 1 ? 'вчера в ' + hhmm(iso) : D.dateShort(iso.slice(0, 10)) + ' в ' + hhmm(iso);
  }
  const initials = (name) => String(name || '').trim().split(/\s+/).slice(0, 2).map((w) => w[0] || '').join('').toUpperCase() || '—';

  const ICON = {
    scales: '<path d="M12 3v18M6 21h12M5 7h14M5 7l-3 7a3 3 0 0 0 6 0L5 7zm14 0-3 7a3 3 0 0 0 6 0l-3-7z"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    disk: '<path d="M5 3h11l3 3v15H5zM8 3v5h8V3M8 21v-7h8v7"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
    more: '<circle cx="12" cy="5" r=".8"/><circle cx="12" cy="12" r=".8"/><circle cx="12" cy="19" r=".8"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
    eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
    down: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
    up: '<path d="M12 20V9M7 14l5-5 5 5M5 4h14"/>',
    chev: '<path d="m6 9 6 6 6-6"/>',
    left: '<path d="M19 12H5M11 18l-6-6 6-6"/>',
    right: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    gear: '<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
    warn: '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/>',
    app: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/>',
    sample: '<path d="M4 4h16v16H4zM8 9h8M8 13h8M8 17h5"/>'
  };
  const icon = (name) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[name]}</svg>`;

  /* ================= состояние экрана ================= */

  // view: home | list | deal | profile | backup; step: 1..6 для сделки.
  let ui = { view: 'home', step: 1, caseId: null, dealId: null, menu: null, tried: [] };

  const kase = () => db.cases.find((c) => c.id === ui.caseId) || null;
  const deal = () => { const c = kase(); return c ? c.deals.find((d) => d.id === ui.dealId) || null : null; };
  const stmt = (d) => (d.statements || []).find((s) => s.kind === 'statement') || d.statements[0];

  function roots() {
    const c = kase(), d = deal();
    return { case: c, deal: d, profile: db.profile, debtor: c ? S.debtorOf(c) : null, cp: c && d ? S.counterpartyOf(c, d) : null };
  }
  function resolve(path) {
    const seg = String(path).split('.');
    let o = roots()[seg[0]];
    for (let i = 1; i < seg.length - 1 && o; i++) o = o[seg[i]];
    return o ? { obj: o, key: seg[seg.length - 1] } : null;
  }
  const getPath = (p) => { const r = resolve(p); return r ? r.obj[r.key] : ''; };
  const setPath = (p, v) => { const r = resolve(p); if (r) r.obj[r.key] = v; };

  /* ================= верхняя панель ================= */

  function savedState(state) {
    const el = $('#saved');
    if (!el) return;
    el.classList.toggle('busy', state === 'busy');
    el.innerHTML = state === 'busy' ? icon('disk') + '<span class="hide-m">Сохраняется…</span>'
      : icon('disk') + `<span class="hide-m">Сохранено${db.ui.savedAt ? ' в ' + hhmm(db.ui.savedAt) : ''}</span>`;
  }

  function renderBar() {
    const name = db.profile.name;
    $('#bar').innerHTML = `
      <button class="logo" data-act="home">${icon('scales')}СделкоСпар</button><span class="tag">прототип</span>
      <div class="sp">
        <span class="saved" id="saved"></span>
        <button class="ghost hide-m" data-act="menu" data-id="profile">${icon('user')}Профиль ${icon('chev')}</button>
        <button class="ghost" data-act="menu" data-id="more" aria-label="Ещё">${icon('more')}</button>
      </div>
      ${ui.menu === 'profile' ? `<div class="menu">
        <div class="who"><span class="ava">${esc(initials(name))}</span><div><b>${esc(name || 'Профиль не заполнен')}</b>
          <div class="small muted">финансовый управляющий</div></div></div>
        <button data-act="go" data-id="profile">${icon('user')}Профиль</button>
        <button data-act="go" data-id="backup">${icon('disk')}Резервные копии</button>
        <button data-act="go" data-id="settings">${icon('gear')}Настройки</button>
      </div>` : ''}
      ${ui.menu === 'more' ? `<div class="menu">
        <button data-act="go" data-id="profile" class="only-m">${icon('user')}Профиль</button>
        <button data-act="go" data-id="backup">${icon('disk')}Резервные копии</button>
        <hr>
        <button data-act="demo">${icon('sample')}Пример на вымышленных данных</button>
        <button data-act="old-app">${icon('app')}Рабочее приложение (прежний вид)</button>
        <hr>
        <button data-act="wipe" style="color:var(--bad)">${icon('trash')}Очистить данные прототипа</button>
      </div>` : ''}`;
    savedState('ok');
  }

  /* ================= главная и список ================= */

  function allDeals() {
    const out = [];
    for (const c of db.cases) for (const d of c.deals) out.push({ c, d });
    return out.sort((a, b) => String(b.d.updatedAt || '').localeCompare(String(a.d.updatedAt || '')));
  }

  // Сделка, в которую ничего не ввели, в список не попадает: это просто
  // нажатая и брошенная «Новая сделка».
  const isEmpty = (c, d) => !S.partyName(S.debtorOf(c)) && !d.date && !d.amount && !c.number;
  function dropEmpty() {
    for (const c of db.cases) c.deals = c.deals.filter((d) => d.id === ui.dealId || !isEmpty(c, d));
    db.cases = db.cases.filter((c) => c.deals.length);
  }

  function screenHome() {
    const last = allDeals()[0];
    return `<div class="wrap home">
      <h1>СделкоСпар</h1>
      <p class="lead">Подготовка документов по оспариванию сделок</p>
      <button class="bigcard" data-act="new">
        <span class="plus">${icon('plus')}</span>
        <b>НОВАЯ СДЕЛКА</b>
        <span class="muted">Подготовить заявление об оспаривании</span>
      </button>
      <button class="linecard" data-act="go" data-id="list">
        ${icon('folder')}<span><b>Открыть сохранённую</b><span class="muted small">Продолжить работу</span></span>
      </button>
      ${last ? `<div class="last">
        <div class="cap">Последняя работа</div>
        <div class="box">
          <div><b>${esc(last.c.number ? 'Дело № ' + last.c.number : 'Номер дела не указан')}</b>
            <div>${esc(S.partyName(S.debtorOf(last.c)) || 'Должник не указан')}</div>
            <div class="small muted">Сохранено ${esc(whenSaved(last.d.updatedAt))}</div></div>
          <button class="btn pri" data-act="open" data-case="${last.c.id}" data-deal="${last.d.id}">Продолжить ${icon('right')}</button>
        </div>
      </div>` : ''}
    </div>`;
  }

  function screenList() {
    const rows = allDeals().map(({ c, d }) => `<div class="item">
        <div class="who"><b>${esc(S.partyName(S.debtorOf(c)) || 'Должник не указан')}</b>
          <span class="small muted">${esc(c.number ? '№ ' + c.number : 'без номера')} · ${esc(S.dealTypeName(d))}${d.date ? ' от ' + esc(D.dateShort(d.date)) : ''}
          · сохранено ${esc(whenSaved(d.updatedAt))}</span></div>
        <button class="btn sm" data-act="open" data-case="${c.id}" data-deal="${d.id}">Открыть</button>
        <button class="ghost" data-act="del-deal" data-case="${c.id}" data-deal="${d.id}" aria-label="Удалить">${icon('trash')}</button>
      </div>`).join('');
    return `<div class="wrap">
      <div class="head"><button class="ghost" data-act="home">${icon('left')}Назад</button><h1>Сохранённые сделки</h1><span class="spacer"></span></div>
      <div class="card list">${rows || '<p class="muted" style="margin:0">Сохранённых сделок пока нет.</p>'}</div>
    </div>`;
  }

  /* ================= поля ================= */

  // Поле, без которого документ не собрать, подсвечивается, только когда
  // человек уже нажал «Далее»: пустая форма не должна встречать красным.
  function field(o) {
    const val = o.value != null ? o.value : getPath(o.bind);
    const empty = val === '' || val == null;
    const miss = o.required && empty && ui.tried.includes(ui.step);
    let control;
    if (o.type === 'select') {
      control = `<select data-bind="${attr(o.bind)}">${o.options.map((op) =>
        `<option value="${attr(op.id)}"${String(op.id) === String(val) ? ' selected' : ''}>${esc(op.name)}</option>`).join('')}</select>`;
    } else if (o.type === 'textarea') {
      control = `<textarea data-bind="${attr(o.bind)}" placeholder="${attr(o.placeholder || '')}" rows="${o.rows || 5}">${esc(val)}</textarea>`;
    } else {
      control = `<div class="inp"><input type="${o.type || 'text'}" data-bind="${attr(o.bind)}" value="${attr(val == null ? '' : val)}"
        placeholder="${attr(o.placeholder || '')}"${o.money ? ' class="money" data-kind="money" inputmode="decimal"' : ''}${o.list ? ` list="${o.list}"` : ''}>
        ${o.money ? '<span class="suf">₽</span>' : ''}</div>`;
    }
    return `<div class="f${miss ? ' miss' : ''}"><label>${esc(o.label)}${o.required ? ' <span class="req">*</span>' : ''}</label>${control}
      ${miss ? '<span class="help m">Нужно для заявления</span>' : o.help ? `<span class="help">${esc(o.help)}</span>` : ''}</div>`;
  }

  /* ================= шаги сделки ================= */

  const STEPS = [
    { no: 1, name: 'Данные сделки', stage: 0 },
    { no: 2, name: 'Основание', stage: 0 },
    { no: 3, name: 'Обстоятельства', stage: 1 },
    { no: 4, name: 'Доказательства', stage: 1 },
    { no: 5, name: 'Проверка', stage: 2 },
    { no: 6, name: 'Готово', stage: 2 }
  ];
  const STAGES = [{ name: 'Сделка', first: 1 }, { name: 'Обстоятельства', first: 3 }, { name: 'Результат', first: 5 }];

  function progress() {
    const cur = STEPS[ui.step - 1].stage;
    const parts = [];
    STAGES.forEach((s, i) => {
      if (i) parts.push(`<span class="line${i <= cur ? ' done' : ''}"></span>`);
      parts.push(`<button class="dot${i < cur ? ' done' : i === cur ? ' on' : ''}" data-act="step" data-id="${s.first}"><i></i><span>${esc(s.name)}</span></button>`);
    });
    return `<div class="progress">${parts.join('')}</div>
      <div class="substep">Шаг ${Math.min(ui.step, 5)} из 5 · ${esc(STEPS[ui.step - 1].name)}</div>`;
  }

  function screenDeal() {
    const c = kase(), d = deal();
    if (!c || !d) { ui.view = 'home'; return screenHome(); }
    const title = S.partyShort(S.debtorOf(c)) ? 'Сделка · ' + S.partyShort(S.debtorOf(c)) : 'Новая сделка';
    const body = [null, s1, s2, s3, s4, s5, s6][ui.step](c, d);
    const wide = ui.step === 3;
    return `<div class="wrap${wide ? ' wide' : ''}">
      <div class="head"><button class="ghost" data-act="back">${icon('left')}Назад</button><h1>${esc(title)}</h1><span class="spacer"></span></div>
      ${ui.step < 6 ? progress() : ''}
      ${body}
    </div>`;
  }

  function dock() {
    if (ui.view !== 'deal' || ui.step >= 6) return '';
    if (ui.step === 5) {
      return `<div class="dock"><div class="in">
        <button class="btn" data-act="back">${icon('left')}Назад</button><span class="grow"></span>
        <button class="btn pri" data-act="form">Сформировать</button></div></div>`;
    }
    return `<div class="dock"><div class="in">
      <button class="btn" data-act="save">Сохранить</button>
      <span class="grow">Шаг ${ui.step} из 5 · сохраняется автоматически</span>
      <button class="btn pri" data-act="next">Далее ${icon('right')}</button></div></div>`;
  }

  /* ---------- 1. данные сделки ---------- */

  function s1(c, d) {
    const cp = S.counterpartyOf(c, d);
    const org = cp && cp.kind === 'org';
    const debtor = S.debtorOf(c);
    return `<div class="card" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 20px">
        <span style="flex:1;min-width:220px" class="small">Есть печатная форма из рабочей системы? Поля заполнятся сами.</span>
        <button class="btn sm" data-act="import-form">${icon('up')}Загрузить печатную форму</button>
      </div>

      <div class="card">
        <h2>Информация о сделке</h2>
        <div class="row2" style="margin-top:14px">
          ${field({ label: 'Дата сделки', bind: 'deal.date', type: 'date', required: true })}
          ${field({ label: 'Вид сделки', bind: 'deal.type', type: 'select', options: D.DEAL_TYPES })}
        </div>
        ${field({ label: 'Стоимость сделки', bind: 'deal.amount', money: true, required: true, placeholder: '1 250 000' })}
        ${field({ label: 'Что передано', bind: 'deal.subject', placeholder: 'квартира, г. Пятигорск, ул. Примерная, д. 1, кв. 1, кадастровый № …',
          help: 'Одной строкой — так предмет попадёт в заявление' })}
      </div>

      <div class="card">
        <h2>Должник</h2>
        ${field({ label: 'ФИО', bind: 'debtor.fio', required: true, placeholder: 'Иванов Иван Иванович' })}
        <div class="row2" style="margin-top:14px">
          ${field({ label: 'ИНН', bind: 'debtor.inn', placeholder: '000000000000' })}
          ${field({ label: 'Номер дела', bind: 'case.number', required: true, placeholder: 'А00-12345/2026' })}
        </div>
        ${field({ label: 'Адрес регистрации', bind: 'debtor.address' })}
        <div class="row2" style="margin-top:14px">
          ${field({ label: 'Арбитражный суд', bind: 'case.court', required: true, placeholder: 'Арбитражный суд Ставропольского края', list: 'courts' })}
          ${field({ label: 'Дата решения о банкротстве', bind: 'case.procedureDate', type: 'date' })}
        </div>
        <datalist id="courts">${['Арбитражный суд Ставропольского края', 'Арбитражный суд города Москвы', 'Арбитражный суд Московской области',
          'Арбитражный суд Челябинской области', 'Арбитражный суд Кабардино-Балкарской Республики'].map((s) => `<option value="${s}">`).join('')}</datalist>
      </div>

      <div class="card">
        <h2>Стороны сделки</h2>
        <div class="row2" style="margin-top:12px;align-items:start">
          <div>
            <div class="small muted" style="font-weight:600;margin-bottom:8px">Должник</div>
            <div id="debtor-card" style="padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2)">
              ${debtorCard(debtor)}
            </div>
          </div>
          <div>
            <div class="small muted" style="font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">Контрагент
              <span class="seg" style="height:30px"><button data-act="cp-kind" data-id="person" class="${org ? '' : 'on'}" style="padding:0 10px;font-size:12.5px">Гражданин</button><button data-act="cp-kind" data-id="org" class="${org ? 'on' : ''}" style="padding:0 10px;font-size:12.5px">Организация</button></span></div>
            ${field({ label: org ? 'Наименование' : 'ФИО', bind: org ? 'cp.nameFull' : 'cp.fio', required: true })}
            ${field({ label: 'ИНН', bind: 'cp.inn' })}
            ${field({ label: 'Адрес', bind: org ? 'cp.addressLegal' : 'cp.address' })}
          </div>
        </div>
      </div>`;
  }

  /* ---------- 2. основание ---------- */

  // В законе у статьи 61.2 пункты, а не части: «п. 1», «п. 2».
  const GROUNDS = [
    { id: 'unequal', law: 'п. 1 ст. 61.2', name: 'Неравноценное встречное исполнение',
      text: 'Цена или условия сделки существенно хуже для должника, чем в сравнимых сделках.' },
    { id: 'harm', law: 'п. 2 ст. 61.2', name: 'Причинение вреда кредиторам',
      text: 'Сделка совершена, чтобы причинить вред кредиторам, и вред причинён.' },
    { id: 'preference', law: 'ст. 61.3', name: 'Предпочтение одному кредитору',
      text: 'Один кредитор получил больше, чем получил бы при расчётах по очереди.' },
    { id: 'sham', law: 'ст. 170 ГК РФ', name: 'Мнимая сделка', extra: true,
      text: 'Сделка совершена лишь для вида: имущество фактически осталось у должника.' }
  ];
  const groundName = (id) => (GROUNDS.find((g) => g.id === id) || {}).name || id;

  function s2(c, d) {
    const base = d.baseGrounds || [];
    const showExtra = ui.showExtra || base.includes('sham');
    const card = (g) => {
      const on = base.includes(g.id);
      return `<button class="gcard${on ? ' on' : ''}" data-act="ground" data-id="${g.id}">
        ${on ? `<span class="chk">${icon('check')}</span>` : ''}
        <span class="law">${esc(g.law)}</span>
        <b>${esc(g.name)}</b>
        ${on ? '' : `<p>${esc(g.text)}</p><span class="pick">Выбрать ${icon('right')}</span>`}
      </button>`;
    };
    return `<h2 style="font-size:18px;margin-top:18px">Выберите основание оспаривания</h2>
      <p class="lead small">Можно выбрать несколько — в заявлении они часто идут вместе.</p>
      ${GROUNDS.filter((g) => !g.extra).map(card).join('')}
      ${showExtra ? GROUNDS.filter((g) => g.extra).map(card).join('')
        : '<p style="margin-top:14px"><button class="link" data-act="more-grounds">Ещё основание: мнимая сделка (ст. 170 ГК)</button></p>'}
      ${ui.tried.includes(2) && !base.length ? '<p class="small" style="color:var(--bad);margin-top:12px">Выберите хотя бы одно основание — от него зависит текст заявления.</p>' : ''}`;
  }

  /* ---------- 3. обстоятельства ---------- */

  /*
   * Вопросы вместо текста. Ответ «да» добавляет в заявление готовую фразу;
   * «нет» и «неизвестно» не добавляют ничего, а в подсказке справа
   * обстоятельство остаётся недоказанным — видно, что ещё выяснить.
   * Фразы — только о фактах; правовые выводы уже стоят в шаблоне заявления.
   */
  const QS = {
    harm: [
      { id: 'h_insolvent', t: 'На дату сделки должник уже не исполнял обязательства перед кредиторами?', el: 'Неплатёжеспособность на дату сделки',
        yes: 'На дату совершения Сделки должник отвечал признаку неплатёжеспособности: у него имелись неисполненные обязательства перед кредиторами.' },
      { id: 'h_use', t: 'После сделки должник продолжал пользоваться имуществом?', el: 'Имущество фактически осталось у должника',
        yes: 'После совершения Сделки должник продолжал владеть и пользоваться отчуждённым имуществом.' },
      { id: 'h_nopay', t: 'Оплата по сделке должнику фактически не поступала?', el: 'Встречного предоставления не было',
        yes: 'Доказательства поступления должнику оплаты по Сделке отсутствуют.' }
    ],
    preference: [
      { id: 'p_earlier', t: 'Сделкой погашен долг перед контрагентом, возникший раньше других?', el: 'Погашено более раннее требование', pref: 'earlier_claim' },
      { id: 'p_order', t: 'Долги перед другими кредиторами той же очереди остались непогашенными?', el: 'Нарушена очерёдность', pref: 'order' },
      { id: 'p_security', t: 'Контрагенту дано обеспечение по уже существовавшему долгу?', el: 'Обеспечение по старому долгу', pref: 'security' }
    ],
    sham: [
      { id: 's_kept', t: 'Имущество фактически осталось у должника?', el: 'Имущество фактически не передавалось',
        yes: 'Имущество фактически осталось во владении и пользовании должника.' },
      { id: 's_nopay', t: 'Расчётов по сделке фактически не было?', el: 'Расчёты не производились',
        yes: 'Расчёты по Сделке фактически не производились.' }
    ],
    party: [
      { id: 'a_related', t: 'Контрагент — заинтересованное лицо: родственник, общий руководитель или участник?', el: 'Заинтересованность контрагента' },
      { id: 'w_knew', t: 'Контрагент знал или должен был знать о долгах должника?', el: 'Осведомлённость контрагента' }
    ]
  };

  /** Состав правовых разделов следует за основаниями и способом передачи. */
  function syncBlocks(c, d) {
    for (const st of d.statements || []) {
      for (const b of S.statementBlocks(db, c, d, st)) if (b.condition) b.ref.enabled = b.available;
    }
  }

  /** Ответы → поля движка: пояснения, основания, заинтересованность. */
  function applyAnswers(c, d) {
    const qa = d.qa || (d.qa = {});
    const base = d.baseGrounds || [];
    const yes = (id) => qa[id] === 'yes';
    const on = (g) => base.includes(g);
    d.harmNote = on('harm') ? QS.harm.filter((q) => yes(q.id)).map((q) => q.yes).join(' ') : '';
    d.shamNote = on('sham') ? QS.sham.filter((q) => yes(q.id)).map((q) => q.yes).join(' ') : '';
    d.preferenceGrounds = on('preference') ? QS.preference.filter((q) => yes(q.id)).map((q) => q.pref) : [];
    const party = on('harm') || on('preference');
    const grounds = base.slice();
    if (party && yes('a_related')) grounds.push('affiliation');
    if (party && yes('w_knew')) grounds.push('awareness');
    d.affiliationGrounds = grounds.includes('affiliation') ? [qa.a_type || 'family'] : [];
    S.setGrounds(d, grounds);
    syncBlocks(c, d);
  }

  function yn(q, qa) {
    const v = qa[q.id];
