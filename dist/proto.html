<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>СделкоСпар — прототип</title>
<style>
/*
 * Прототип по концепту: строгий рабочий инструмент без левого меню.
 * Светлый фон #F7F8FA, белые блоки, границы в 1px, радиус 10–12,
 * графитовый текст, один акцентный цвет, никаких градиентов.
 * Поля и главные кнопки высотой 46px, рабочая колонка 760px.
 * Акцент задан одной переменной --accent — его легко поменять.
 */
:root{
  --bg:#F7F8FA;--surface:#FFFFFF;--surface-2:#F1F3F6;
  --border:#E3E6EB;--border-2:#CDD2D9;
  --text:#1B1F24;--text-2:#4F5761;--text-3:#7D8590;
  --accent:#1F4E8C;--accent-2:#173E70;--accent-soft:#EAF0F8;--on-accent:#FFFFFF;
  --ok:#1F7A4D;--ok-soft:#E8F4EE;--warn:#9A5B00;--warn-soft:#FFF4E0;--bad:#B42318;--bad-soft:#FDECEA;
  --r:12px;--r-sm:10px;--h:46px;--w:760px;
  --shadow:0 1px 2px rgba(16,24,40,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1115;--surface:#171A20;--surface-2:#1E222A;--border:#272C35;--border-2:#363C47;
    --text:#E7EAEE;--text-2:#B1B8C2;--text-3:#808894;
    --accent:#7FA6E6;--accent-2:#A2C0F0;--accent-soft:#1B2636;--on-accent:#0F1115;
    --ok:#5BC08C;--ok-soft:#14261D;--warn:#E3A948;--warn-soft:#2A2113;--bad:#F07A6E;--bad-soft:#2C1715;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1115;--surface:#171A20;--surface-2:#1E222A;--border:#272C35;--border-2:#363C47;
  --text:#E7EAEE;--text-2:#B1B8C2;--text-3:#808894;
  --accent:#7FA6E6;--accent-2:#A2C0F0;--accent-soft:#1B2636;--on-accent:#0F1115;
  --ok:#5BC08C;--ok-soft:#14261D;--warn:#E3A948;--warn-soft:#2A2113;--bad:#F07A6E;--bad-soft:#2C1715;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- верхняя панель ---------- */
.bar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border)}
.bar .in{max-width:1120px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em;
  cursor:pointer;background:none;border:0;padding:0}
.logo svg.i{width:22px;height:22px;color:var(--accent)}
.tag{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px}
.bar .sp{margin-left:auto;display:flex;align-items:center;gap:6px}
.saved{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-3);padding:0 10px;
  border-right:1px solid var(--border);margin-right:4px}
.saved.busy{color:var(--warn)}
.ghost{height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 11px;border-radius:8px;
  border:0;background:none;color:var(--text-2);font-size:14px;cursor:pointer}
.ghost:hover{background:var(--surface-2);color:var(--text)}
.menu{position:absolute;right:20px;top:52px;min-width:240px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);box-shadow:0 12px 32px -12px rgba(16,24,40,.25);padding:6px;z-index:40}
.menu .who{display:flex;align-items:center;gap:10px;padding:10px 10px 12px;border-bottom:1px solid var(--border);margin-bottom:6px}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;
  border-radius:8px;font-size:14px;cursor:pointer;text-align:left;color:var(--text)}
.menu button:hover{background:var(--surface-2)}
.menu button.only-m{display:none}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.ava{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.ava.big{width:64px;height:64px;font-size:22px}

/* ---------- рабочая колонка ---------- */
.wrap{max-width:var(--w);margin:0 auto;padding:28px 20px 120px}
.wrap.wide{max-width:1120px}
.muted{color:var(--text-3)}
.small{font-size:13px}
.lead{color:var(--text-2);margin:6px 0 0}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px 24px;
  box-shadow:var(--shadow);margin-top:16px}
.card>h2{font-size:17px;margin-bottom:4px}
.card>.lead{margin:0 0 16px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.f{display:flex;flex-direction:column;gap:6px;margin-top:14px;min-width:0}
.f:first-child{margin-top:0}
.row2 .f{margin-top:0}
.f label{font-size:13.5px;font-weight:500;color:var(--text-2)}
.f .req{color:var(--bad)}
.f .help{font-size:12.5px;color:var(--text-3)}
.inp{position:relative;display:flex;align-items:center}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;height:var(--h);
  border:1px solid var(--border-2);background:var(--surface);border-radius:var(--r-sm);padding:0 14px;
  font-size:15px;color:var(--text);transition:border-color .12s,box-shadow .12s}
select{appearance:none;-webkit-appearance:none;padding-right:36px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat}
textarea{height:auto;min-height:120px;padding:12px 14px;line-height:1.55;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--text-3)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp .suf{position:absolute;right:14px;color:var(--text-3);pointer-events:none}
.inp input.money{padding-right:34px}
.f.miss input,.f.miss select,.f.miss textarea{border-color:var(--bad)}
.f.miss .help.m{color:var(--bad)}

/* кнопки */
.btn{height:var(--h);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;
  border-radius:var(--r-sm);border:1px solid var(--border-2);background:var(--surface);color:var(--text);
  font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.sm{height:36px;padding:0 13px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--accent);font-size:14px;font-weight:500;cursor:pointer}
.link:hover{text-decoration:underline}
.seg{display:inline-flex;border:1px solid var(--border-2);border-radius:var(--r-sm);overflow:hidden;height:40px}
.seg button{border:0;background:var(--surface);padding:0 16px;font-size:14px;cursor:pointer;color:var(--text-2);
  border-right:1px solid var(--border-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* ---------- главная ---------- */
.home{text-align:center;padding-top:36px}
.home h1{font-size:30px;letter-spacing:-.02em}
.bigcard{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;margin-top:28px;padding:38px 24px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;
  box-shadow:var(--shadow);transition:border-color .12s,box-shadow .12s;font:inherit;color:inherit}
.bigcard:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bigcard .plus{width:48px;height:48px;border-radius:12px;background:var(--accent);color:var(--on-accent);
  display:flex;align-items:center;justify-content:center}
.bigcard .plus svg.i{width:24px;height:24px}
.bigcard b{font-size:17px;letter-spacing:.02em}
.linecard{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;padding:16px 20px;text-align:left;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;font:inherit;color:inherit}
.linecard:hover{border-color:var(--border-2);background:var(--surface-2)}
.linecard svg.i{color:var(--text-2);width:22px;height:22px}
.linecard b{display:block;font-size:15px}
.last{text-align:left;margin-top:30px;padding-top:22px;border-top:1px solid var(--border)}
.last .cap{font-size:13px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}
.last .box{display:flex;align-items:flex-end;gap:14px;justify-content:space-between;margin-top:10px;flex-wrap:wrap}

/* ---------- шаги ---------- */
.head{display:flex;align-items:center;gap:12px}
.head h1{font-size:22px;flex:1;text-align:center}
.head .spacer{width:90px}
.progress{display:flex;align-items:center;gap:0;margin:22px 0 4px}
.dot{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-3);white-space:nowrap;cursor:pointer;
  background:none;border:0;padding:0}
.dot i{width:12px;height:12px;border-radius:50%;border:2px solid var(--border-2);background:var(--surface);flex:none}
.dot.done{color:var(--text-2)}.dot.done i{background:var(--accent);border-color:var(--accent)}
.dot.on{color:var(--text);font-weight:600}.dot.on i{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.line{flex:1;height:2px;background:var(--border);margin:0 12px;min-width:24px}
.line.done{background:var(--accent)}
.substep{font-size:13px;color:var(--text-3);margin-bottom:6px}

/* липкая нижняя панель */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--border);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
.dock .in{max-width:var(--w);margin:0 auto;display:flex;align-items:center;gap:12px}
.dock .in .grow{flex:1;font-size:13px;color:var(--text-3)}

/* основания */
.gcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:20px 22px;margin-top:12px;cursor:pointer;font:inherit;color:inherit;position:relative;transition:border-color .12s,box-shadow .12s}
.gcard:hover{border-color:var(--border-2)}
.gcard .law{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.gcard b{display:block;font-size:17px;margin-top:6px}
.gcard p{margin:6px 0 0;color:var(--text-2);font-size:14px;max-width:560px}
.gcard .pick{position:absolute;right:20px;bottom:18px;font-size:14px;font-weight:500;color:var(--accent)}
.gcard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gcard.on .pick{color:var(--ok)}
.gcard .chk{position:absolute;right:20px;top:18px;width:24px;height:24px;border-radius:50%;background:var(--accent);
  color:var(--on-accent);display:flex;align-items:center;justify-content:center}

/* обстоятельства: вопросы слева, подсказка справа */
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.hintp{position:sticky;top:76px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px}
.hintp h3{font-size:15px;margin-bottom:10px}
.hintp .el{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;margin:0 0 9px;color:var(--text-2)}
.hintp .el .st{width:18px;height:18px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;margin-top:1px}
.st.y{background:var(--ok-soft);color:var(--ok)}.st.n{background:var(--bad-soft);color:var(--bad)}.st.u{background:var(--surface-2);color:var(--text-3)}
.hintp .per{font-size:13.5px;border-top:1px solid var(--border);padding-top:12px;margin-top:12px;color:var(--text-2)}
.hintp .gen{font-size:13px;border-top:1px solid var(--border);padding-top:12px;margin-top:12px;color:var(--text-2);
  font-family:"Times New Roman",Times,serif;line-height:1.5}
.q{padding:16px 0;border-top:1px solid var(--border)}
.q:first-of-type{border-top:0;padding-top:4px}
.q .t{font-weight:500;margin-bottom:10px}
.yn{display:inline-flex;gap:8px;flex-wrap:wrap}
.yn button{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--border-2);background:var(--surface);
  font-size:14px;cursor:pointer;color:var(--text-2);display:inline-flex;align-items:center;gap:7px}
.yn button::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--border-2);box-sizing:border-box}
.yn button.on{border-color:var(--accent);color:var(--text);background:var(--accent-soft)}
.yn button.on::before{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 2px var(--surface)}
.sub{margin-top:12px;padding-left:14px;border-left:2px solid var(--border)}
.verdict{font-size:14px;margin-top:12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--text-2)}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}

/* доказательства */
.drop{border:2px dashed var(--border-2);border-radius:var(--r);padding:36px 20px;text-align:center;background:var(--surface);
  transition:border-color .12s,background .12s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .btn{margin:10px 0 8px}
.doc{border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-top:12px;background:var(--surface)}
.doc .top{display:flex;align-items:center;gap:10px}
.doc .top b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .ok{color:var(--ok)}

/* проверка */
.sec{padding:18px 0;border-top:1px solid var(--border)}
.sec:first-child{border-top:0;padding-top:0}
.sec .cap{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 14px;font-size:15px}
.kv dt{color:var(--text-3)}.kv dd{margin:0}
.kv dd.no{color:var(--bad)}
.sec .edit{display:flex;justify-content:flex-end;margin-top:8px}

/* готово */
.finish{text-align:center;padding-top:30px}
.finish .ico{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;
  justify-content:center;margin:0 auto 14px}
.finish .ico svg.i{width:30px;height:30px;stroke-width:2.2}
.finish .actbox{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;padding:20px 22px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r);cursor:pointer;font:inherit;color:inherit;font-size:16px;font-weight:500}
.finish .actbox:hover{border-color:var(--accent)}
.finish .actbox svg.i{color:var(--accent);width:22px;height:22px}

/* списки */
.list .item{display:flex;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--border)}
.list .item:first-child{border-top:0}
.list .item .who{flex:1;min-width:0}
.list .item b{display:block}

/* настройки */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--border)}
.setrow:first-child{border-top:0}
.pillok{font-size:13px;font-weight:600;color:var(--ok);display:inline-flex;align-items:center;gap:6px}
.pillok::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.warnbox{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--warn);font-size:14px;margin-top:14px}

/* окно предпросмотра и сообщения */
.modal{position:fixed;inset:0;z-index:60;background:rgba(16,24,40,.45);display:flex;align-items:flex-start;justify-content:center;
  padding:5vh 16px;overflow:auto}
.modal .box{background:var(--surface);border-radius:var(--r);width:100%;max-width:520px;padding:22px 24px;
  box-shadow:0 24px 60px -20px rgba(16,24,40,.45)}
.modal .box.sheetbox{max-width:880px;background:var(--surface-2);padding:18px}
.modal h3{font-size:18px}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:14px;z-index:70}

/* лист A4 — одинаковый в светлой и тёмной теме */
.paper{width:794px;max-width:100%;margin:12px auto 0;background:#fff;color:#111;border-radius:4px;
  padding:76px 57px 76px 113px;font:15px/1.5 "Times New Roman",Times,serif;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.paper p{margin:0;text-align:justify;text-indent:1.25em}
.paper p.center{text-align:center;text-indent:0}.paper p.right{text-align:right;text-indent:0}
.paper p.left{text-align:left;text-indent:0}.paper p.b{font-weight:700}
.paper .miss{background:#FDECEA;color:#B42318;border-radius:3px;padding:0 4px;font:12px/1.4 -apple-system,"Segoe UI",sans-serif}

/* ---------- телефон ---------- */
@media (max-width:760px){
  .head h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .head .spacer{width:0}
  .row2{grid-template-columns:1fr}
  .split{grid-template-columns:1fr}
  .hintp{position:static}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px}
  .bar .hide-m{display:none}
  .menu button.only-m{display:flex}
  .head .spacer{display:none}
  .head h1{text-align:left;font-size:19px}
  .progress .dot span{display:none}
  .dock .in .grow{display:none}
  .dock .in .btn{flex:1}
  .paper{padding:36px 22px}
  .gcard .pick{position:static;display:block;margin-top:10px}
}
</style>
</head>
<body>
<header class="bar"><div class="in" id="bar"></div></header>
<main id="app"></main>
<div id="dock"></div>
<div id="modal-root"></div>

<script>/*
 * Справочники, реестр переменных и библиотека блоков.
 *
 * Здесь нет ни разметки, ни логики интерфейса — только данные. Разделение
 * из ТЗ (§33): данные, логика формы, текстовые шаблоны и структура заявления
 * живут отдельно, чтобы правка формулировки не требовала правки кода.
 *
 * Тексты блоков — обычные редактируемые шаблоны. Никакой автоматической
 * юридической квалификации приложение не делает: какой блок включать,
 * решает пользователь.
 */
(function () {
  'use strict';

  const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
    'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

  /* ================= форматирование ================= */

  const nf2 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  /**
   * «8 400 000,00». Разряды разделяет неразрывный пробел: иначе сумма
   * переносится на вторую строку и в документе читается как два числа.
   */
  function money(v) {
    if (v == null || v === '' || !isFinite(v)) return '';
    return nf2.format(Number(v)).replace(/\s/g, '\u00A0');
  }

  const ISO = /^(\d{4})-(\d{2})-(\d{2})$/;

  /** «15 апреля 2025 года» — так дата выглядит в судебном документе. */
  function dateLong(iso) {
    const m = ISO.exec(String(iso || ''));
    if (!m) return '';
    return Number(m[3]) + ' ' + MONTHS[Number(m[2]) - 1] + ' ' + m[1] + ' года';
  }

  function dateShort(iso) {
    const m = ISO.exec(String(iso || ''));
    return m ? m[3] + '.' + m[2] + '.' + m[1] : '';
  }

  function plural(n, one, few, many) {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }

  /* ---------- сумма прописью ----------
   * В заявлении сумма пишется цифрами и прописью. Считать её вручную —
   * ровно та рутина, ради которой приложение и делается.
   */
  const ONES_M = ['', 'один', 'два', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять'];
  const ONES_F = ['', 'одна', 'две', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять'];
  const TEENS = ['десять', 'одиннадцать', 'двенадцать', 'тринадцать', 'четырнадцать',
    'пятнадцать', 'шестнадцать', 'семнадцать', 'восемнадцать', 'девятнадцать'];
  const TENS = ['', '', 'двадцать', 'тридцать', 'сорок', 'пятьдесят',
    'шестьдесят', 'семьдесят', 'восемьдесят', 'девяносто'];
  const HUNDREDS = ['', 'сто', 'двести', 'триста', 'четыреста', 'пятьсот',
    'шестьсот', 'семьсот', 'восемьсот', 'девятьсот'];

  function triadWords(n, female) {
    const out = [];
    const h = Math.floor(n / 100), t = Math.floor((n % 100) / 10), o = n % 10;
    if (h) out.push(HUNDREDS[h]);
    if (t === 1) out.push(TEENS[o]);
    else {
      if (t) out.push(TENS[t]);
      if (o) out.push((female ? ONES_F : ONES_M)[o]);
    }
    return out;
  }

  /** «8 400 000,55» → «восемь миллионов четыреста тысяч рублей 55 копеек». */
  function moneyWords(v) {
    if (v == null || v === '' || !isFinite(v)) return '';
    const total = Math.round(Math.abs(Number(v)) * 100);
    const rub = Math.floor(total / 100);
    const kop = total % 100;

    const scales = [
      { one: 'миллиард', few: 'миллиарда', many: 'миллиардов', female: false },
      { one: 'миллион', few: 'миллиона', many: 'миллионов', female: false },
      { one: 'тысяча', few: 'тысячи', many: 'тысяч', female: true },
      { one: 'рубль', few: 'рубля', many: 'рублей', female: false }
    ];

    const triads = [
      Math.floor(rub / 1e9) % 1000,
      Math.floor(rub / 1e6) % 1000,
      Math.floor(rub / 1e3) % 1000,
      rub % 1000
    ];

    const words = [];
    let started = false;
    for (let i = 0; i < 4; i++) {
      const n = triads[i], s = scales[i];
      const last = i === 3;
      if (!n && !last) continue;
      if (n || (last && !started)) {
        if (n || last) words.push(...triadWords(n, s.female));
      }
      if (n || last) {
        words.push(plural(n, s.one, s.few, s.many));
        started = true;
      }
    }

    // Ноль рублей триадами не набирается: 0 % 1000 === 0 и слов не даёт.
    let text = words.filter(Boolean).join(' ');
    if (!rub) text = 'ноль ' + plural(0, 'рубль', 'рубля', 'рублей');

    const sign = Number(v) < 0 ? 'минус ' : '';
    return sign + text[0].toUpperCase() + text.slice(1) + ' ' +
      String(kop).padStart(2, '0') + ' ' + plural(kop, 'копейка', 'копейки', 'копеек');
  }

  /* ---------- родительный падеж ФИО ----------
   * «Финансовый управляющий имуществом должника Абрамовой Зарият Руслановны» —
   * так пишут во всех шапках. Из печатной формы эта строка приходит готовой,
   * а для дела, заведённого руками, склоняем сами по типовым окончаниям.
   * Правила покрывают обычные русские ФИО и заведомо не покрывают всё:
   * поле остаётся редактируемым, и это осознанный размен.
   */
  const FEM = /(?:а|я)$/;

  // Беглые гласные правилами не выводятся — их всего несколько, перечислим.
  const IRREGULAR = { 'пётр': 'Петра', 'петр': 'Петра', 'лев': 'Льва', 'павел': 'Павла' };

  function genWord(w, isFemale, kind) {
    if (!w) return w;
    const low = w.toLowerCase();
    const end = (n, tail) => w.slice(0, w.length - n) + tail;

    if (kind === 'patronymic') {
      if (/(ович|евич|ьич|ич)$/.test(low)) return w + 'а';
      if (/(овна|евна|ична|инична)$/.test(low)) return end(1, 'ы');
    }

    // Фамилии склоняются иначе, чем имена: «Королева» → «Королевой», но
    // «Екатерина» → «Екатерины». Поэтому правила разведены по роли слова.
    if (kind === 'surname') {
      if (/(ов|ев|ёв|ин|ын)а$/.test(low)) return end(1, 'ой');
      if (/ая$/.test(low)) return end(2, 'ой');
      if (/(ов|ев|ёв|ин|ын)$/.test(low)) return w + 'а';
      if (/(ский|цкий|ий|ый)$/.test(low)) return end(2, 'ого');
      if (/(ко|ых|их)$/.test(low)) return w;
    }

    if (kind === 'name' && IRREGULAR[low] && !isFemale) return IRREGULAR[low];
    if (/ь$/.test(low)) return end(1, isFemale ? 'и' : 'я');
    if (/я$/.test(low)) return end(1, 'и');
    if (/(жа|ча|ша|ща|га|ка|ха)$/.test(low)) return end(1, 'и');
    if (/а$/.test(low)) return end(1, 'ы');
    if (/й$/.test(low)) return end(1, 'я');
    if (/[оеиуыэю]$/.test(low)) return w;          // несклоняемые
    return isFemale ? w : w + 'а';                  // мужское на согласную
  }

  // Аббревиатуры (ООО, АО, ПАО) не склоняются вовсе.
  const ORG_FORMS = [
    ['Общество с ограниченной ответственностью', 'Общества с ограниченной ответственностью'],
    ['Публичное акционерное общество', 'Публичного акционерного общества'],
    ['Непубличное акционерное общество', 'Непубличного акционерного общества'],

    ['Открытое акционерное общество', 'Открытого акционерного общества'],
    ['Акционерное общество', 'Акционерного общества'],
    ['Индивидуальный предприниматель', 'Индивидуального предпринимателя'],
    ['Товарищество с ограниченной ответственностью', 'Товарищества с ограниченной ответственностью'],
    ['Крестьянское (фермерское) хозяйство', 'Крестьянского (фермерского) хозяйства']

  /** «Общество с ограниченной ответственностью «Ромашка»» → «Общества …». */
  function genitiveOrg(name) {
    const s = String(name || '').trim();
    for (const [from, to] of ORG_FORMS) {
      if (s.toLowerCase().startsWith(from.toLowerCase())) return to + s.slice(from.length);
    }
    return s;
  }

  /** «Абрамова Зарият Руслановна» → «Абрамовой Зарият Руслановны». */
  function genitiveFio(fio) {
    const parts = String(fio || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '';
    // Пол определяем по отчеству — оно надёжнее фамилии.
    const isFemale = parts.length > 2
      ? /(овна|евна|ична|инична)$/i.test(parts[2])
      : FEM.test(parts[0]);
    return parts.map((w, i) =>
      genWord(w, isFemale, i === 2 ? 'patronymic' : i === 0 ? 'surname' : 'name')).join(' ');
  }

  /** Пошлина по цене иска: имущественное требование, подлежащее оценке. */
  function feeByValue(amount, kind) {
    const scale = FEE_SCALES[kind] || FEE_SCALES.org;
    const v = Number(amount);
    if (!isFinite(v) || v <= 0) return { sum: 0, step: scale.steps[0] };
    let step = scale.steps[0];
    for (const s of scale.steps) if (v > s.over) step = s;
    const sum = Math.min(step.base + step.rate * (v - step.over), scale.cap);
    // До копеек считает закон, но в платёжку идут целые рубли — и именно
    // так посчитаны заявления, по которым сверялась формула.
    return { sum: Math.round(sum), step: step, raw: sum };

      description: 'Что произойдёт, если возврат не состоится.',
      group: 'Предложение',
      required: true,
      template:
        'Прошу сообщить о принятом решении в течение {{OFFER_DAYS}} календарных дней со дня ' +
        'получения настоящего предложения по адресу: {{MANAGER_ADDRESS}}, либо по электронной ' +
        'почте: {{MANAGER_CONTACTS}}.\n' +
        'Если возврат не будет произведён в разумный срок после поступления настоящего ' +
        'предложения, заявление об оспаривании сделки будет подано в арбитражный суд, а расходы ' +
        'по уплате государственной пошлины и иные судебные издержки будут отнесены на Вас.'
    },

    {
      id: 'sign',
      kinds: ALL_KINDS,
      name: 'Подпись',
      description: 'Дата, должность и подпись заявителя.',
      group: 'Требования',
      required: true,
      template:
        '{{TODAY}}\n' +
        '\n' +
        '{{MANAGER_TITLE}}\n' +
        '_________________ / {{MANAGER_NAME}} /'
    }
  ];

  /* ================= служебное ================= */

  const byId = (list, id) => list.find((x) => x.id === id) || null;
  const nameOf = (list, id, fallback) => {
    const x = byId(list, id);
    return x ? x.name : (fallback || '');
  };

  globalThis.ZData = {
    MONTHS, money, moneyWords, dateLong, dateShort, plural, genitiveFio, genitiveOrg,
    DEAL_TYPES, OBJECT_TYPES, PROCEDURES, LEGACY_PROCEDURES, PARTY_KINDS, DOC_TYPES,
    FEE_SCALES, FEE_INVALIDATION, FEE_BANKRUPTCY_SHARE, feeByValue,
    DOC_KINDS, ALL_KINDS, GROUNDS,
    PERFORMANCE, AFFILIATION_GROUNDS, PREFERENCE_GROUNDS,
    CURRENCIES, REALTY_KINDS,
    VARS, VAR_INDEX, BLOCKS,
    byId, nameOf
  };
})();

<script>/*
 * Таблицы по кредитному отчёту ОКБ.
 *
 * Разбор PDF делает parser.js — тот же файл, что и в анализаторе отчётов,
 * скопированный без правок. Здесь только выборка: когда по каждому договору
 * возникла просрочка, чему она равнялась и что было на дату оспариваемой
 * сделки.
 *
 * Выводов приложение не делает. «Момент неплатёжеспособности» — правовая
 * квалификация, и её даёт человек; таблица показывает факты из отчёта и
 * самую раннюю просрочку, а формулировку заявления пишет управляющий.
 *
 * Отчёт хранится в деле в урезанном виде: из сотни страниц берутся только
 * поля, нужные таблицам. Иначе одно дело займёт весь localStorage.
 */
(function () {
  'use strict';

  const D = globalThis.ZData;

  /* ================= хранимый вид отчёта ================= */

  /** Из разобранного отчёта оставляем только то, что попадёт в таблицы. */
  function compact(report) {
    const contracts = (report.contracts || []).map((c) => ({
      creditor: c.creditor || '',
      kind: shortKind(c.kind),
      number: c.contractNumber || '',
      date: c.contractDate || null,
      closed: !!c.isClosed,
      assigned: !!c.isAssigned,
      amount: c.amount && c.amount.value != null ? c.amount.value : null,
      page: c.page || null,
      snapshots: (c.debtSnapshots || []).map((s) => ({
        date: s.date, principal: s.principal, total: s.total,
        overdue: s.overdue || 0, since: s.overdueSince || null, days: s.overdueDays || 0
      }))
    })).filter((c) => c.snapshots.length || c.creditor);

    return {
      fio: (report.meta && report.meta.fio) || '',
      reportDate: (report.meta && report.meta.reportDate) || '',
      version: (report.meta && report.meta.version) || '',
      pages: (report.meta && report.meta.pages) || 0,
      loadedAt: new Date().toISOString(),
      contracts: contracts
    };
  }

  /** Вид обязательства ОКБ печатает канцелярской строкой — берём хвост. */
  function shortKind(kind) {
    const k = String(kind || '').replace(/^Договор займа \(кредита\)\s*[-—]\s*/i, '').trim();
    return k || 'заём (кредит)';
  }

  const label = (c) => {
    const bits = [];
    if (c.number) bits.push('№ ' + c.number);
    if (c.date) bits.push('от ' + D.dateShort(c.date));
    return (c.kind || 'договор') + (bits.length ? ', ' + bits.join(' ') : '');
  };

  /* ================= возникновение просрочки ================= */

  /**
   * По каждому договору — первый снимок долга с ненулевой просрочкой.
   * ОКБ печатает не только сумму просрочки, но и дату, с которой она
   * считается; берём именно её, а не дату снимка: снимки редкие, и по ним
   * просрочка «появляется» на месяц-другой позже, чем возникла.
   */
  function overdueStarts(okb) {
    const rows = [];
    for (const c of okb.contracts || []) {
      const first = c.snapshots.find((s) => s.overdue > 0);
      if (!first) continue;
      const last = c.snapshots[c.snapshots.length - 1];
      rows.push({
        creditor: c.creditor,
        contract: label(c),
        since: first.since || first.date,
        exact: !!first.since,          // дата взята из отчёта, а не выведена из снимка
        seenAt: first.date,
        overdue: first.overdue,
        days: first.days,
        cured: last.overdue === 0,
        closed: c.closed,
        lastOverdue: last.overdue,
        lastDate: last.date,
        page: c.page
      });
    }
    rows.sort((a, b) => (a.since < b.since ? -1 : a.since > b.since ? 1 : 0));
    return rows;
  }

  /** Самая ранняя просрочка, которая к последнему снимку так и не погашена. */
  function earliestUncured(rows) {
    const alive = rows.filter((r) => !r.cured);
    return (alive[0] || rows[0] || null);
  }

  /* ================= просрочка на дату ================= */

  /** Снимок долга, ближайший к дате слева: что отчёт знал на этот момент. */
  function snapshotAt(contract, iso) {
    let found = null;
    for (const s of contract.snapshots) {
      if (s.date <= iso) found = s; else break;
    }
    return found;
  }

  function overdueAt(okb, iso) {
    const rows = [];
    for (const c of okb.contracts || []) {
      const s = snapshotAt(c, iso);
      if (!s || !(s.overdue > 0)) continue;
      rows.push({
        creditor: c.creditor,
        contract: label(c),
        principal: s.principal,
        overdue: s.overdue,
        since: s.since,
        days: s.since ? daysBetween(s.since, iso) : s.days,
        snapshot: s.date,
        page: c.page
      });
    }
    rows.sort((a, b) => b.overdue - a.overdue);
    return rows;
  }

  const daysBetween = (a, b) => {
    const x = String(a).split('-').map(Number), y = String(b).split('-').map(Number);
    return Math.round((Date.UTC(y[0], y[1] - 1, y[2]) - Date.UTC(x[0], x[1] - 1, x[2])) / 86400000);
  };

  const plural = (n, a, b, c) => D.plural(n, a, b, c);
  const sum = (rows, key) => rows.reduce((n, r) => n + (Number(r[key]) || 0), 0);

  /* ================= таблицы для заявления ================= */

  /**
   * «Возникновение просроченной задолженности».
   * Итог таблицы — не вывод, а исходные данные для вывода, который делает
   * управляющий: самая ранняя непогашенная просрочка выделена отдельной
   * строкой пояснения под таблицей.
   */
  function tableInsolvency(okb, opts) {
    const rows = overdueStarts(okb);
    if (!rows.length) return null;
    const limit = (opts && opts.limit) || 0;
    const shown = limit ? rows.slice(0, limit) : rows;

    return {
      kind: 'table',
      id: 'insolvency',
      head: ['Кредитор', 'Обязательство', 'Просрочка с', 'Дней', 'Сумма просрочки, ₽', 'Погашена'],
      align: ['left', 'left', 'center', 'right', 'right', 'center'],
      rows: shown.map((r) => [
        r.creditor,
        r.contract,
        r.since ? D.dateShort(r.since) : '—',
        r.days ? String(r.days) : '—',
        D.money(r.overdue),
        r.cured ? 'да' : 'нет'
      ]),
      note: shown.length < rows.length
        ? 'Показаны первые ' + shown.length + ' из ' + rows.length + ' обязательств.' : '',
      meta: { rows: rows, earliest: earliestUncured(rows) }
    };
  }

  /** «Просроченная задолженность на дату сделки». */
  function tableOverdue(okb, iso, opts) {
    if (!iso) return null;
    const rows = overdueAt(okb, iso);
    if (!rows.length) return null;
    const limit = (opts && opts.limit) || 0;
    const shown = limit ? rows.slice(0, limit) : rows;

    const table = {
      kind: 'table',
      id: 'overdue',
      head: ['Кредитор', 'Обязательство', 'Основной долг, ₽', 'Просрочено, ₽', 'Просрочка с', 'Дней'],
      align: ['left', 'left', 'right', 'right', 'center', 'right'],
      rows: shown.map((r) => [
        r.creditor,
        r.contract,
        r.principal == null ? '—' : D.money(r.principal),
        D.money(r.overdue),
        r.since ? D.dateShort(r.since) : '—',
        r.days ? String(r.days) : '—'
      ]),
      total: ['Итого', '', D.money(sum(shown, 'principal')), D.money(sum(shown, 'overdue')), '', ''],
      note: shown.length < rows.length
        ? 'Показаны крупнейшие ' + shown.length + ' из ' + rows.length + ' обязательств.' : '',
      meta: { rows: rows, date: iso, sumOverdue: sum(rows, 'overdue'), sumPrincipal: sum(rows, 'principal') }
    };
    return table;
  }

  /* ================= подстановки в текст ================= */

  /**
   * Переменные, которыми блок заявления может сослаться на цифры отчёта,
   * не вставляя таблицу целиком.
   */
  function vars(okb, dealDate) {
    if (!okb || !(okb.contracts || []).length) {
      return {
        OKB_REPORT_DATE: '', OKB_CREDITORS: '', OKB_FIRST_OVERDUE_DATE: '',
        OKB_FIRST_OVERDUE_CREDITOR: '', OKB_OVERDUE_SUM: '', OKB_OVERDUE_COUNT: '',
        OKB_OVERDUE_TOTAL_WORDS: ''
      };
    }
    const starts = overdueStarts(okb);
    const earliest = earliestUncured(starts);
    const at = dealDate ? overdueAt(okb, dealDate) : [];
    const total = sum(at, 'overdue');

    return {
      OKB_REPORT_DATE: okb.reportDate ? D.dateLong(okb.reportDate) : '',
      OKB_CREDITORS: String((okb.contracts || []).length),
      OKB_FIRST_OVERDUE_DATE: earliest && earliest.since ? D.dateLong(earliest.since) : '',
      OKB_FIRST_OVERDUE_CREDITOR: earliest ? earliest.creditor : '',
      OKB_OVERDUE_SUM: at.length ? D.money(total) : '',
      OKB_OVERDUE_COUNT: at.length ? at.length + ' ' + plural(at.length, 'обязательству', 'обязательствам', 'обязательствам') : '',
      OKB_OVERDUE_TOTAL_WORDS: at.length ? D.moneyWords(total) : ''
    };
  }

  globalThis.ZOkb = {
    compact, shortKind, label,
    overdueStarts, earliestUncured, overdueAt, snapshotAt, daysBetween,
    tableInsolvency, tableOverdue, vars
  };
})();
</script>
<script>/*
 * Счета должника: разбор сведений ФНС и банковских справок об остатках.
 *
 * Задача узкая. Ходатайство об отсрочке уплаты госпошлины держится на одном
 * доводе — платить нечем, — и подтверждается ответами банков об остатках.
 * Значит, документу нужны названия банков, остаток по каждому, общая сумма
 * и по строке приложения на банк. Привязка «какой счёт в каком банке» в текст
 * не попадает никогда, поэтому и добывать её не нужно.
 *
 * Главная трудность — сами файлы. Справка ФНС приходит сканом, прогнанным
 * через распознавание: половина страниц лежит вверх ногами, кириллица
 * распознана латиницей по форме букв («ОТКРЫТ» → «OTKPBIT»), а на
 * перевёрнутых страницах врут и цифры. Поэтому здесь нет ни одной догадки:
 * пара «БИК — номер счёта» принимается только если сходится ключ проверки
 * (Положение Банка России № 579-П). Ключ ловит любую подменённую цифру,
 * и всё, что его не прошло, в дело не попадает — вместо выдуманного банка
 * приложение честно скажет, сколько страниц прочитать не удалось.
 */
(function () {
  'use strict';

  /* ================= ключ проверки счёта ================= */

  const WEIGHTS = [7, 1, 3, 7, 1, 3, 7, 1, 3, 7, 1, 3, 7, 1, 3, 7, 1, 3, 7, 1, 3, 7, 1];

  /**
   * Ключ проверки: к номеру счёта слева приписывается «условный номер»
   * банка — три последние цифры БИК, а для счетов в подразделении Банка
   * России «0» и разряды 5–6 БИК. Сумма поразрядных произведений на веса,
   * взятая по последней цифре, должна делиться на 10.
   */
  function checkKey(bik, account) {
    if (!/^\d{9}$/.test(bik) || !/^\d{20}$/.test(account)) return false;
    const tail = bik.slice(6);
    const prefix = tail === '000' ? '0' + bik.slice(4, 6) + '0' : tail;
    const s = prefix + account;
    let sum = 0;
    for (let i = 0; i < 23; i++) sum += (Number(s[i]) * WEIGHTS[i]) % 10;
    return sum % 10 === 0;
  }

  /** Контрольные разряды ИНН юридического лица — второй независимый сторож. */
  function innValid(inn) {
    if (!/^\d{10}$/.test(inn)) return false;
    const w = [2, 4, 10, 3, 5, 9, 4, 6, 8];
    let sum = 0;
    for (let i = 0; i < 9; i++) sum += Number(inn[i]) * w[i];
    return (sum % 11) % 10 === Number(inn[9]);
  }

  /* ================= чтение распознанного текста ================= */

  /*
   * Латинские буквы, которыми распознавание подменяет кириллицу по форме.
   * Свёртка нужна ровно для одного вопроса — открыт счёт или закрыт, — и
   * для него её точности хватает с запасом: «ОТКРЫТ» и «ЗАКРЫТ» не спутать
   * даже с половиной угаданных букв. Названия банков так не восстановить,
   * и попыток здесь нет.
   */
  const FOLD = {
    A: 'А', B: 'В', C: 'С', E: 'Е', H: 'Н', K: 'К', M: 'М', O: 'О', P: 'Р',
    T: 'Т', X: 'Х', Y: 'У', a: 'а', c: 'с', e: 'е', o: 'о', p: 'р', x: 'х',
    y: 'у', '3': 'З', '0': 'О', 'I': 'І', 'J': 'Ј'
  };

  const fold = (s) => String(s || '').replace(/[ABCEHKMOPTXYaceopxy30IJ]/g, (ch) => FOLD[ch] || ch).toLowerCase();

  const OPEN = /откр/;
  const CLOSED = /закр|прекра/;

  /** Открыт ли счёт по обрывку текста рядом с его номером. */
  function accountState(chunk) {
    const f = fold(chunk);
    // Закрытие важнее: у закрытого счёта в строке стоят обе даты, и слово
    // «открытия» из заголовка колонки попадает в тот же обрывок.
    if (CLOSED.test(f)) return 'closed';
    if (OPEN.test(f)) return 'open';
    return 'unknown';
  }

  /**
   * Сборка текста страницы с учётом поворота.
   *
   * Сканы этого рода лежат в файле боком: матрица текста повёрнута на ±90°,
   * и строка идёт вдоль оси X, а не Y. Если читать «как обычно», строки
   * рассыпаются на отдельные буквы. Здесь ось строки выбирается по матрице.
   */
  function pageText(items) {
    if (!items.length) return { text: '', angle: 0 };
    const m = items[0].transform || [1, 0, 0, 1, 0, 0];
    const turned = Math.abs(m[1]) > Math.abs(m[0]) && Math.abs(m[2]) > Math.abs(m[3]);
    const angle = !turned ? 0 : (m[2] > 0 ? 90 : -90);

    // Для повёрнутого текста «номер строки» — это X, а порядок внутри
    // строки задаёт Y; знак зависит от того, в какую сторону повёрнута
    // страница.
    const lineOf = (it) => Math.round((turned ? it.transform[4] : it.transform[5]) / 4);
    const posOf = (it) => (turned ? it.transform[5] : it.transform[4]);
    const desc = angle === 90;

    const rows = new Map();
    for (const it of items) {
      const k = lineOf(it);
      if (!rows.has(k)) rows.set(k, []);
      rows.get(k).push(it);
    }
    const keys = [...rows.keys()].sort((a, b) => (turned ? (desc ? a - b : b - a) : b - a));
    const lines = keys.map((k) => rows.get(k)
      .sort((a, b) => (desc ? posOf(b) - posOf(a) : posOf(a) - posOf(b)))
      .map((i) => i.str).join(' ').replace(/\s+/g, ' ').trim())
      .filter((s) => s);
    return { text: lines.join('\n'), angle: angle };
  }

  /* ================= сведения ФНС ================= */

  const BIK_RE = /\b(04\d{7})\b/g;
  const ACC_RE = /\b(\d{20})\b/g;
  const INN_RE = /\b(\d{10})\s*[/／]\s*\d{9}\b/g;

  const all = (re, text) => {
    const out = [];
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(text))) out.push({ value: m[1], at: m.index });
    return out;
  };

  /**
   * Разбор одной страницы сведений об открытых и закрытых счетах.
   *
   * Порядок такой: собрать кандидатов в БИК и номера счетов, а затем
   * связать их ключом проверки. Ни один счёт не приписывается банку
   * «по соседству» — только по сошедшемуся ключу.
   */
  function parseFnsPage(text, num) {
    const biks = all(BIK_RE, text);
    const accs = all(ACC_RE, text).filter((a) => !biks.some((b) => Math.abs(b.at - a.at) < 3));
    const inns = all(INN_RE, text).filter((i) => innValid(i.value));

    const found = [];
    let orphans = 0;
    for (const acc of accs) {
      const fits = biks.filter((b) => checkKey(b.value, acc.value));
      if (!fits.length) { orphans++; continue; }
      // Если ключ сошёлся с несколькими БИК (бывает, когда у банков
      // совпадают три последние цифры), берём ближайший по тексту.
      fits.sort((a, b) => Math.abs(a.at - acc.at) - Math.abs(b.at - acc.at));
      const bik = fits[0].value;
      // Состояние счёта ищем в тексте после номера — до следующего
      // двадцатизначного номера или до конца абзаца.
      const next = accs.find((a) => a.at > acc.at);
      const chunk = text.slice(acc.at + 20, next ? next.at : Math.min(text.length, acc.at + 220));
      found.push({ bik: bik, account: acc.value, state: accountState(chunk), page: num });
    }

    // ИНН приписываем БИК, ближайшему по тексту: в справке они стоят
    // в одной строке реквизитов банка.
    const innFor = {};
    for (const b of biks) {
      const near = inns.filter((i) => Math.abs(i.at - b.at) < 200)
        .sort((a, b2) => Math.abs(a.at - b.at) - Math.abs(b2.at - b.at))[0];
      if (near) innFor[b.value] = near.value;
    }

    // Название банка — строка перед строкой реквизитов, но только если
    // распознавание не превратило её в латиницу.
    const nameFor = {};
    const lines = text.split('\n');
    let pos = 0;
    const starts = lines.map((l) => { const p = pos; pos += l.length + 1; return p; });
    for (const b of biks) {
      let li = 0;
      while (li + 1 < starts.length && starts[li + 1] <= b.at) li++;
      for (let i = li; i >= 0 && i >= li - 3; i--) {
        const cand = cleanName(lines[i]);
        if (cand) { nameFor[b.value] = cand; break; }
      }
    }

    return { accounts: found, inn: innFor, names: nameFor, orphans: orphans, biks: biks.length };
  }

  /** Строка похожа на название банка? Латинская каша сюда не проходит. */
  function cleanName(line) {
    const s = String(line || '').trim();
    if (s.length < 6 || s.length > 160) return '';
    const cyr = (s.match(/[А-Яа-яЁё]/g) || []).length;
    if (cyr < s.replace(/[^A-Za-zА-Яа-яЁё]/g, '').length * 0.8) return '';
    if (/^(РегНом|ИНН|БИК|Адрес|Дата|Форма|Сведения|№)/i.test(s)) return '';
    if (!/(банк|bank|кредит|казначейств|НКО|организаци)/i.test(s)) return '';
    return s.replace(/\s+/g, ' ');
  }

  /**
   * Как читать страницу.
   *
   * На перевёрнутом скане цифры распознаются чужими глифами: «28.06.2018»
   * превращается в «810C°90°8C». Поэтому несколько правильных дат — дешёвый
   * и надёжный признак того, что цифрам страницы можно верить.
   *
   *   good    — читаем, цифры верны;
   *   garbled — таблица счетов есть, но прочитана неправильно: о такой
   *             странице нужно сказать вслух, иначе банк тихо пропадёт;
   *   plain   — титул, подпись, продолжение адреса: брать нечего и терять
   *             тоже нечего.
   */
  function pageKind(text) {
    const s = String(text || '');
    const dates = (s.match(/\b\d{2}\.\d{2}\.(?:19|20)\d{2}\b/g) || []).length;
    if (dates >= 3) return 'good';
    // Перевёрнутый номер счёта распознаётся вперемешку с буквами —
    // «10000000000L018L180Y». Два таких обрывка на странице означают, что
    // таблица счетов там есть, а прочитать её не вышло.
    const junk = (s.match(/[0-9A-Za-z°]{16,}/g) || [])
      .filter((t) => (t.match(/\d/g) || []).length >= 8 && /[A-Za-z°]/.test(t)).length;
    return junk >= 2 ? 'garbled' : 'plain';
  }

  /**
   * Сведения ФНС целиком.
   * pages — [{ text, angle, num }]. Возвращает банки с открытыми счетами
   * и честный отчёт о том, что прочитать не удалось.
   */
  function parseFns(pages) {
    const byBik = new Map();
    const unreadable = [];
    let closed = 0;

    // Первый проход: страницы, которым можно верить, и БИК с них. На
    // перевёрнутых страницах цифры переставлены, и подмешивать их БИК
    // в общий список нельзя — ключ проверки сойдётся у одной пары
    // из десяти случайно, и в деле окажется несуществующий банк.
    const good = pages.filter((p) => pageKind(p.text) === 'good');
    for (const p of pages) if (pageKind(p.text) === 'garbled') unreadable.push(p.num);

    const pool = [];
    const parsed = good.map((p) => {
      const r = parseFnsPage(p.text, p.num);
      for (const a of r.accounts) if (!pool.includes(a.bik)) pool.push(a.bik);
      return { page: p, res: r };
    });

    for (const { page, res } of parsed) {
      // Второй проход: счёт, чей банк напечатан на другой странице
      // (так разрывается таблица), привязываем по общему списку БИК —
      // по-прежнему только через сошедшийся ключ проверки.
      const known = new Set(res.accounts.map((a) => a.account));
      for (const orphan of orphanAccounts(page.text, known)) {
        const fits = pool.filter((b) => checkKey(b, orphan.account));
        if (fits.length === 1) res.accounts.push({ bik: fits[0], account: orphan.account, state: orphan.state, page: page.num });
      }

      for (const a of res.accounts) {
        if (!byBik.has(a.bik)) {
          byBik.set(a.bik, {
            bik: a.bik, inn: res.inn[a.bik] || '', name: res.names[a.bik] || '',
            open: [], closed: [], pages: []
          });
        }
        const bank = byBik.get(a.bik);
        if (!bank.inn && res.inn[a.bik]) bank.inn = res.inn[a.bik];
        if (!bank.name && res.names[a.bik]) bank.name = res.names[a.bik];
        if (!bank.pages.includes(a.page)) bank.pages.push(a.page);
        if (bank.open.includes(a.account) || bank.closed.includes(a.account)) continue;
        if (a.state === 'closed') { bank.closed.push(a.account); closed++; }
        else bank.open.push(a.account);
      }
    }

    const banks = [...byBik.values()].filter((b) => b.open.length);
    banks.sort((a, b) => b.open.length - a.open.length || a.bik.localeCompare(b.bik));
    return {
      banks: banks,
      closedOnly: [...byBik.values()].filter((b) => !b.open.length),
      closed: closed,
      unreadable: unreadable,
      pages: pages.length
    };
  }

  /** Номера счетов страницы, которым банк на своей же странице не нашёлся. */
  function orphanAccounts(text, known) {
    const accs = all(ACC_RE, text).filter((a) => !known.has(a.value));
    return accs.map((a, i) => {
      const next = accs[i + 1];
      const chunk = text.slice(a.at + 20, next ? next.at : Math.min(text.length, a.at + 220));
      return { account: a.value, state: accountState(chunk) };
    });
  }

  /* ================= справочник банков ================= */

  /*
   * Справочника банков в приложении, по сути, нет — и это осознанно.
   * Полный список БИК живёт на сайте Банка России и меняется каждый месяц;
   * зашитая копия через год начнёт называть банки их прежними именами,
   * а один неверно подставленный банк в ходатайстве хуже пустого поля.
   *
   * Поэтому здесь только те записи, которые проверены по самим документам,
   * а дальше справочник наполняет работа: название, введённое руками или
   * взятое из имени файла справки, запоминается в настройках и в следующем
   * деле подставляется само.
   */
  const KNOWN = [
    { bik: '044525225', inn: '7707083893', name: 'ПАО «Сбербанк России»' },
    { bik: '044525593', inn: '7728168971', name: 'АО «Альфа-Банк»' },
    { bik: '044525974', inn: '7710140679', name: 'АО «ТБанк»' },
    { bik: '044525272', inn: '7729405872', name: 'ПАО Банк ЗЕНИТ' },
    { bik: '044525232', inn: '7702045051', name: 'ПАО «МТС-Банк»' },
    { bik: '044525245', inn: '7735057951', name: 'ООО «Хоум Кредит энд Финанс Банк»' },
    { bik: '044525054', inn: '7729496647', name: 'НКО «ЭЛЕКСНЕТ» (ООО)' }
  ];

  /**
   * Название банка: сперва то, что человек уже вводил (dir), затем
   * проверенный справочник, затем прочитанное из справки. Если ничего нет —
   * пустая строка, а не «Банк неизвестен»: поле должно выглядеть незаполненным.
   */
  function bankName(bik, inn, dir, read) {
    const own = dir || {};
    if (bik && own[bik]) return own[bik];
    if (inn && own[inn]) return own[inn];
    const k = KNOWN.find((b) => (bik && b.bik === bik) || (inn && b.inn === inn));
    if (k) return k.name;
    return read || '';
  }

  /* ================= справка банка об остатке ================= */

  // Разряды разделяются пробелом только по три: иначе «38 52 5230» из
  // соседних колонок склеится в одно число 3852.
  const NUM = '(\\d{1,3}(?:[ \\u00A0\\u202F]\\d{3})+(?:[.,]\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)';
  const toNum = (s) => {
    const n = Number(String(s).replace(/[\s  ]/g, '').replace(',', '.'));
    return isFinite(n) ? n : null;
  };

  /*
   * Единой формы справки об остатке не существует: у каждого банка своя.
   * Поэтому здесь не «парсер», а несколько узнаваемых форм, и каждая
   * говорит, откуда взяла цифру. Что не узнано — остаётся пустым: остаток
   * вводится руками, а не угадывается.
   */
  const SHAPES = [
    {
      id: 'table',
      // Табличная выписка (так печатает Сбербанк): строка счёта — дата
      // открытия, прочерк вместо даты закрытия, остаток и служебные коды.
      name: 'таблица счетов',
      run: (text) => {
        const re = new RegExp('\\d{2}\\.\\d{2}\\.\\d{4}\\s+[-–—]\\s+' + NUM + '\\s+\\d+\\s+\\d+\\s+\\d+', 'g');
        const vals = [];
        let m;
        while ((m = re.exec(text))) { const n = toNum(m[1]); if (n != null) vals.push(n); }
        return vals.length ? { total: vals.reduce((a, b) => a + b, 0), parts: vals } : null;
      }
    },
    {
      id: 'final',
      name: 'остаток на конец периода',
      run: (text) => {
        const m = text.match(new RegExp('Остаток\\s+на\\s+конец[^\\d]{0,20}' + NUM));
        const n = m ? toNum(m[1]) : null;
        return n == null ? null : { total: n, parts: [n] };
      }
    },
    {
      id: 'outgoing',
      name: 'исходящий остаток',
      run: (text) => {
        const re = new RegExp('Исходящий\\s+остаток[^\\d]{0,20}' + NUM, 'g');
        let last = null, m;
        while ((m = re.exec(text))) last = toNum(m[1]);
        return last == null ? null : { total: last, parts: [last] };
      }
    },
    {
      id: 'plain',
      name: 'остаток денежных средств',
      run: (text) => {
        const m = text.match(new RegExp('Остаток(?:\\s+(?:собственных|денежных)\\s+средств)?[^\\d\\n]{0,30}' + NUM));
        const n = m ? toNum(m[1]) : null;
        return n == null ? null : { total: n, parts: [n] };
      }
    }
  ];

  function parseBalance(text) {
    for (const shape of SHAPES) {
      const hit = shape.run(text || '');
      if (hit) return { total: hit.total, parts: hit.parts, method: shape.name, id: shape.id };
    }
    return { total: null, parts: [], method: '', id: '' };
  }

  /** БИК банка, выдавшего справку: он же стоит в реквизитах самого банка. */
  function bikFromStatement(text) {
    const hits = all(BIK_RE, text || '').map((h) => h.value);
    if (!hits.length) return '';
    const count = {};
    for (const b of hits) count[b] = (count[b] || 0) + 1;
    return Object.keys(count).sort((a, b) => count[b] - count[a])[0];
  }

  /**
   * Название банка из имени файла: «…открытых в ПАО Сбербанк.pdf».
   * Так их выгружает рабочая система, и это самый надёжный источник
   * названия из всех доступных — банк сам себя назвал.
   */
  function nameFromFile(filename) {
    let s = String(filename || '').replace(/\.[a-z0-9]+$/i, '').trim();
    const m = s.match(/(?:открыт[а-я]*\s+в|в\s+банке?)\s+(.+)$/i);
    if (m) s = m[1];
    else s = s.replace(/^\s*\d+[.)]\s*/, '');
    s = s.replace(/^Сведения об остатке[^,]*,?\s*/i, '').trim();
    if (!/[А-Яа-яЁё]/.test(s) || s.length > 90) return '';
    return s;
  }

  globalThis.ZAccounts = {
    checkKey, innValid, fold, accountState, pageText,
    parseFns, parseFnsPage, pageKind, cleanName,
    parseBalance, bikFromStatement, nameFromFile, toNum,
    KNOWN, bankName
  };
})();
</script>
<script>/*
 * Импорт печатной формы.
 *
 * Рабочая система арбитражного управляющего выгружает по каждому делу
 * «печатную форму» — DOCX, в котором реквизиты суда, должника, управляющего
 * и процедуры уже подставлены, а сведения о сделке оставлены пустыми.
 * Ровно те данные, которые иначе пришлось бы перебивать руками.
 *
 * Читаем такой файл прямо в браузере: .docx — это ZIP с XML внутри, а
 * распаковку берёт на себя DecompressionStream, встроенный в браузер и в
 * Node. Никаких библиотек и никакой отправки файла на сервер.
 *
 * Разбор намеренно снисходительный: формулировки в формах гуляют от суда
 * к суду, поэтому каждое поле ищется своим правилом, а ненайденное просто
 * остаётся пустым — пользователь дозаполнит его в форме дела.
 */
(function () {
  'use strict';

  /* ================= чтение ZIP ================= */

  const dv = (bytes) => new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);

  /** Ищет запись по имени в центральном каталоге и возвращает её сырые байты. */
  function findEntry(bytes, wanted) {
    const view = dv(bytes);
    // Конец центрального каталога лежит в хвосте; комментария у .docx не бывает,
    // но ищем сигнатуру назад — так надёжнее.
    let eocd = bytes.length - 22;
    while (eocd >= 0 && view.getUint32(eocd, true) !== 0x06054B50) eocd--;
    if (eocd < 0) throw new Error('это не ZIP-архив (а .docx должен им быть)');

    const count = view.getUint16(eocd + 10, true);
    let at = view.getUint32(eocd + 16, true);
    const decoder = new TextDecoder();

    for (let i = 0; i < count; i++) {
      if (view.getUint32(at, true) !== 0x02014B50) throw new Error('повреждён каталог архива');
      const method = view.getUint16(at + 10, true);
      const size = view.getUint32(at + 20, true);
      const nameLen = view.getUint16(at + 28, true);
      const extraLen = view.getUint16(at + 30, true);
      const commentLen = view.getUint16(at + 32, true);
      const offset = view.getUint32(at + 42, true);
      const name = decoder.decode(bytes.subarray(at + 46, at + 46 + nameLen));

      if (name === wanted) {
        const lnLen = view.getUint16(offset + 26, true);
        const leLen = view.getUint16(offset + 28, true);
        const start = offset + 30 + lnLen + leLen;
        return { method: method, data: bytes.subarray(start, start + size) };
      }
      at += 46 + nameLen + extraLen + commentLen;
    }
    return null;
  }

  /** Распаковка. Метод 8 — deflate, его разжимает сам браузер. */
  async function inflate(entry) {
    if (entry.method === 0) return entry.data;
    if (entry.method !== 8) throw new Error('неизвестный метод сжатия ' + entry.method);
    if (typeof DecompressionStream !== 'function') {
      throw new Error('браузер не умеет распаковывать ZIP — обновите его или заполните дело вручную');
    }
    const stream = new Blob([entry.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  /* ================= текст документа ================= */

  const unesc = (s) => String(s)
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
    .replace(/&apos;/g, "'").replace(/&#(\d+);/g, (m, n) => String.fromCharCode(+n))
    .replace(/&amp;/g, '&');

  /**
   * Абзацы и ячейки таблиц — каждый со своей строки.
   *
   * Разбираем XML регулярными выражениями, а не DOMParser: шапка печатной
   * формы свёрстана таблицей, и в разметке важен только порядок текстовых
   * узлов. Заодно это одинаково работает в браузере и в Node.
   */
  function documentText(xml) {
    const lines = [];
    // <w:p> — абзац, </w:tc> — конец ячейки: и то и другое даёт перевод строки.
    for (const chunk of String(xml).split(/<w:p[ >]|<\/w:tc>/)) {
      let text = '';
      const re = /<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>|<w:tab\/>|<w:br\/>/g;
      let m;
      while ((m = re.exec(chunk))) text += m[1] != null ? unesc(m[1]) : ' ';
      text = text.replace(/ /g, ' ').replace(/[ \t]+/g, ' ').trim();
      if (text) lines.push(text);
    }
    return lines.join('\n');
  }

  /** Файл → плоский текст. */
  async function readDocx(bytes) {
    const entry = findEntry(bytes, 'word/document.xml');
    if (!entry) throw new Error('в файле нет word/document.xml — это не документ Word');
    return documentText(new TextDecoder().decode(await inflate(entry)));
  }

  /* ================= разбор печатной формы ================= */

  const one = (re, text, group) => {
    const m = re.exec(text);
    return m ? (m[group || 1] || '').trim() : '';
  };

  /** «28.05.2025» → «2025-05-28». */
  function toIso(d) {
    const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(d).trim());
    if (!m) return '';
    return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
  }

  // \w кириллицу не ловит, поэтому окончания перечислены явно.
  const PROCEDURES = [
    [/реализаци\S*\s+имущества\s+гражданина/i, 'realization'],
    [/реструктуризаци\S*\s+долгов\s+гражданина/i, 'restructuring'],
    // Печатная форма иногда пишет «конкурсное производство» и по гражданину:
    // для должника-физлица это она же реализация имущества.
    [/конкурсн\S*\s+производств/i, 'realization']
  ];

  /**
   * Шапка формы свёрстана таблицей, и длинный адрес разложен по нескольким
   * абзацам ячейки. Строка, оборванная запятой, — продолжение следующей:
   * склеиваем, иначе адрес приезжает обрезанным по первой же запятой.
   */
  function glueWrapped(text) {
    const out = [];
    for (const line of String(text).split('\n')) {
      const prev = out[out.length - 1];
      if (prev != null && /,$/.test(prev)) out[out.length - 1] = prev + ' ' + line;
      else out.push(line);
    }
    return out.join('\n');
  }

  /**
   * Вытаскивает всё, что удаётся опознать. Ничего не выдумывает: поле, для
   * которого правило не сработало, возвращается пустым — пусть человек
   * увидит пробел в форме, а не правдоподобную ошибку в заявлении.
   */
  function parsePrintForm(text) {
    const t = glueWrapped(String(text).replace(/\r/g, ''));
    const out = { found: [], missing: [] };

    /* --- суд --- */
    out.court = one(/^(?:В\s+)?(Арбитражный суд[^\n]*?)\s*$/mi, t);
    // Адрес суда — строка сразу за наименованием, если она начинается с индекса
    // или со слова «Адрес».
    const courtAt = t.indexOf(out.court);
    if (courtAt >= 0) {
      const after = t.slice(courtAt + out.court.length, courtAt + out.court.length + 300);
      out.courtAddress = one(/^\s*\n(?:Адрес:\s*)?(\d{6},[^\n]+|[А-ЯЁ][^\n]*?ул[^\n]+)/i, after);
    }

    /* --- дело --- */
    out.caseNumber = one(/Дело\s*№\s*([A-ZА-Я]?\d+[-–]\d+\/\d{4})/i, t);
    // Дату возбуждения дела формы пишут двумя способами.
    out.caseStartDate = toIso(
      one(/Заявление\s+о\s+признании\s+должника\s+банкротом\s+было\s+принято\s+(\d{1,2}\.\d{1,2}\.\d{4})/i, t) ||
      one(/Определением[^.]{0,200}?от\s+(\d{1,2}\.\d{1,2}\.\d{4})[^.]{0,120}?принято\s+заявление\s+о\s+признании/i, t));

    /* --- судебный акт и процедура --- */
    const act = /((?:Решением|Определением)\s+Арбитражного суда[^\n]*?от\s+(\d{1,2}\.\d{1,2}\.\d{4})\s*г?\.?\s*(?:по делу\s*№?\s*\S+)?)[^\n]*?призна/i.exec(t) ||
      /((?:Решением|Определением)\s+Арбитражного суда[^\n]*?от\s+(\d{1,2}\.\d{1,2}\.\d{4})\s*г?\.?\s*(?:по делу\s*№?\s*\S+)?)/i.exec(t);
    if (act) {
      out.judicialAct = act[1].replace(/\s+/g, ' ').trim();
      out.procedureDate = toIso(act[2]);
    }
    for (const [re, id] of PROCEDURES) {
      if (re.test(t)) { out.procedure = id; break; }
    }

    /* --- должник --- */
    // Шапка даёт имя в именительном падеже — в отличие от тела, где оно
    // стоит в родительном («Абрамовой Зарият Руслановны»).
    out.debtorName = one(/^Должник\s*:?\s*([^\n]+)/mi, t);
    const debtorBlock = /Должник\s*:?\s*[^\n]+\n(?:Адрес:\s*)([^\n]+)/i.exec(t);
    if (debtorBlock) out.debtorAddress = debtorBlock[1].trim();

    // Реквизиты должника напечатаны в теле, в скобках после его имени.
    const paren = /\(([^)]*?(?:СНИЛС|ИНН)[^)]*)\)\s*призна/i.exec(t) ||
      /призна\w+[^.]*?\(([^)]*(?:СНИЛС|ИНН)[^)]*)\)/i.exec(t);
    if (paren) {
      const p = paren[1];
      out.debtorBirthDate = toIso(one(/(\d{1,2}\.\d{1,2}\.\d{4})\s*г\.?\s*р/i, p));
      out.debtorBirthPlace = one(/место\s+рожд[^:]*:\s*([^,]+(?:,[^,]*?(?:р-на|района|обл|края|РФ))?)/i, p);
      out.debtorInn = one(/ИНН\s*:?\s*(\d{10,12})/i, p);
      out.debtorSnils = one(/СНИЛС\s*:?\s*([\d\s-]{11,20})/i, p).replace(/\s/g, '');
      out.debtorRegAddress = one(/адрес\s+рег[^:]*:\s*([^]*?)(?:,\s*СНИЛС|,\s*ИНН|$)/i, p);
    }
    if (!out.debtorAddress) out.debtorAddress = out.debtorRegAddress || '';

    // Родительный падеж ФИО должника формы печатают готовым — это надёжнее
    // любого склонения по правилам.
    out.debtorNameGen = one(/имуществом\s+должника[ \t]*\n?[ \t]*([А-ЯЁ][^\n]{3,80})/i, t)
      .replace(/^[«"']|[»"']$/g, '').trim();
    // Часть форм печатает здесь именительный падеж — тогда толку от него нет,
    // и склонение по правилам сработает лучше.
    if (out.debtorNameGen === out.debtorName) out.debtorNameGen = '';

    /* --- арбитражный управляющий --- */
    const mgr = /(?:Финансовым|Конкурсным|Внешним|Временным|Административным)\s+управляющим\s+утвержден[аы]?\s+([А-ЯЁ][^(,\n]*?)\s*\(/i.exec(t);
    if (mgr) out.managerName = mgr[1].trim();
    if (!out.managerName) {
      // Запасной путь — шапка: строка под «Заявитель: … имуществом должника …».
      out.managerName = one(/имуществом\s+должника[^\n]*\n([А-ЯЁ][а-яё]+\s+[А-ЯЁ][а-яё]+\s+[А-ЯЁ][а-яё]+)/i, t);
    }
    const mgrParen = mgr ? /\(([^)]*)\)/.exec(t.slice(mgr.index + mgr[0].length - 1)) : null;
    if (mgrParen) {
      out.managerInn = one(/ИНН\s*:?\s*(\d{10,12})/i, mgrParen[1]);
      out.managerSnils = one(/СНИЛС\s*:?\s*([\d\s-]{11,20})/i, mgrParen[1]).replace(/\s/g, '');
      out.managerRegNumber = one(/рег\.?\s*номер\s*:?\s*(\d+)/i, mgrParen[1]);
    }
    // Адрес управляющего в шапке идёт следом за его ФИО.
    out.managerAddress = one(/имуществом\s+должника[\s\S]{0,200}?Адрес:\s*([^\n]+)/i, t);

    /* --- СРО --- */
    // Имя СРО зажато между закрывающей скобкой реквизитов управляющего и
    // скобкой с ОГРН: без якоря на «)» в него утягивает эти самые реквизиты.
    const sro = /\)\s*(?:–|—|-|,)\s*(?:член\s+)?([^()\n]{3,160}?)\s*\(\s*ОГРН\s*(\d{13,15})\s*,\s*ИНН\s*(\d{10,12})\s*,\s*адрес:\s*([^)]+)\)/i.exec(t);
    if (sro) {
      // Кавычки снимаем только парные: у «ААУ "Горизонт"» внутренняя кавычка
      // закрывающая, и обрубать её нельзя.
      out.sroName = sro[1].trim().replace(/^(["'«])(.*)\1$/, '$2')
        .replace(/^«(.*)»$/, '$1').trim();
      out.sroOgrn = sro[2];
      out.sroInn = sro[3];
      out.sroAddress = sro[4].trim();
    }

    /* --- ответчик, если в форме он уже указан --- */
    // \s захватывал перевод строки и подставлял в ответчика номер дела,
    // когда графа в форме осталась пустой.
    const resp = /^Ответчик[ \t]*\d*[ \t]*:[ \t]*(\S[^\n]*)\n(?:Адрес:[ \t]*([^\n]+))?/mi.exec(t);
    if (resp && resp[1].trim()) {
      out.respondentName = resp[1].trim();
      out.respondentAddress = (resp[2] || '').trim();
    }

    for (const key of ['court', 'caseNumber', 'debtorName', 'managerName', 'procedure',
      'caseStartDate', 'judicialAct', 'sroName']) {
      (out[key] ? out.found : out.missing).push(key);
    }
    return out;
  }

  /** Понятные названия полей — их показывает отчёт об импорте. */
  const FIELD_NAMES = {
    court: 'Наименование суда', courtAddress: 'Адрес суда',
    caseNumber: 'Номер дела', caseStartDate: 'Дата принятия заявления о банкротстве',
    judicialAct: 'Реквизиты судебного акта', procedure: 'Процедура', procedureDate: 'Дата введения процедуры',
    debtorName: 'ФИО должника', debtorAddress: 'Адрес должника', debtorInn: 'ИНН должника',
    debtorSnils: 'СНИЛС должника', debtorBirthDate: 'Дата рождения должника',
    debtorBirthPlace: 'Место рождения должника',
    debtorNameGen: 'ФИО должника в родительном падеже',
    managerName: 'ФИО управляющего', managerAddress: 'Адрес управляющего',
    managerInn: 'ИНН управляющего', managerSnils: 'СНИЛС управляющего',
    managerRegNumber: 'Регистрационный номер управляющего',
    sroName: 'СРО', sroOgrn: 'ОГРН СРО', sroInn: 'ИНН СРО', sroAddress: 'Адрес СРО',
    respondentName: 'Ответчик', respondentAddress: 'Адрес ответчика'
  };

  globalThis.ZImport = { readDocx, documentText, parsePrintForm, toIso, FIELD_NAMES, findEntry, inflate };
})();
</script>
<script>/*
 * Модель данных, шаблонизатор и правила проверки.
 *
 * Хранилище — localStorage браузера. Своего сервера у приложения нет
 * намеренно: страница должна открываться двойным кликом с флешки, а
 * реквизиты должников и контрагентов — не покидать компьютер.
 *
 * Ни одна функция отсюда не знает про DOM: то же самое выполняется в Node,
 * и на этом построены тесты.
 */
(function () {
  'use strict';

  const D = globalThis.ZData;
  // Разбор отчёта ОКБ подключается отдельным файлом; без него приложение
  // работает как раньше, просто без таблиц по отчёту.
  const OKB = () => globalThis.ZOkb || null;
  const KEY = 'zayav-db';
  const SCHEMA = 1;

  const uid = () => 'x' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const now = () => new Date().toISOString();

  /* ================= каркасы сущностей ================= */

  function newDb() {
    return {
      schema: SCHEMA,
      profile: { name: '', sro: '', address: '', contacts: '', inn: '', snils: '', regNumber: '' },
      cases: [],
      customBlocks: [],     // блоки, созданные пользователем (§11)
      banks: {},            // БИК/ИНН → название банка: справочник растёт от дела к делу
      edits: {}             // правки текстов стандартных блоков: id → template
    };
  }

  function newParty(kind) {
    return {
      id: uid(), kind: kind || 'person',
      nameFull: '', nameShort: '', inn: '', ogrn: '',
      addressLegal: '', addressPostal: '', director: '', representative: '', powerBasis: '',
      fio: '', birthDate: '', birthPlace: '', snils: '', address: '', ogrnip: '',
      role: ''             // 'debtor' — должник дела, подставляется автоматически
    };
  }

  function newCase() {
    // Должник в этой работе всегда гражданин: банкротство физических лиц —
    // единственная процедура, в которой приложение используется.
    const debtor = newParty('person');
    debtor.role = 'debtor';
    return {
      id: uid(), createdAt: now(), updatedAt: now(),
      court: '', courtAddress: '', number: '',
      procedure: 'realization', procedureDate: '', judicialAct: '', caseStartDate: '',
      managerName: '', managerAddress: '', managerContacts: '', managerSro: '',
      managerInn: '', managerSnils: '', managerRegNumber: '',
      creditorsSum: '',
      // Счета должника — для ходатайства об отсрочке. accounts заполняется
      // из сведений ФНС и справок банков; accountsBalance и accountsBanks
      // остаются на случай, когда счета вводят одной строкой, без разбора.
      accounts: [],
      accountsMeta: null,
      accountsBalance: '',
      accountsBanks: '',
      offerDays: '10',      // срок ответа на предложение о возврате
      debtorNameGen: '',    // «…имуществом должника Абрамовой Зарият Руслановны»
      okb: null,            // урезанный кредитный отчёт ОКБ, если он загружен
      debtorId: debtor.id,
      parties: [debtor],
      deals: []
    };
  }

  /**
   * Банк со счетами должника.
   *
   * open/closed — номера счетов из сведений ФНС; в текст они не попадают,
   * но по ним видно, откуда взялся банк, и можно проверить за приложением.
   * balance — остаток: из справки, если она разобралась, иначе с рук.
   */
  function newBank(fields) {
    return Object.assign({
      id: uid(), bik: '', inn: '', name: '',
      include: true,          // снятая галочка убирает банк из ходатайства
      open: [], closed: [],
      balance: '', balanceNote: '',
      statement: '',          // имя файла справки — для строки приложения
      source: 'manual'        // fns | statement | manual
    }, fields || {});
  }

  function newObject(kind) {
    return {
      kind: kind || 'realty',
      // недвижимость
      realtyKind: '', address: '', cadastral: '', area: '', purpose: '', features: '',
      // транспортное средство
      brand: '', model: '', vin: '', plate: '', year: '',
      // денежные средства
      sum: '', payDate: '', orderNumber: '', accountFrom: '', accountTo: '', purposeText: '',
      // иное
      description: '',
      value: ''            // стоимость — общая для всех типов
    };
  }

  function newDeal() {
    return {
      id: uid(), createdAt: now(), updatedAt: now(),
      title: '',
      type: 'sale', typeOther: '',
      date: '', number: '', contractDate: '',
      amount: '', currency: 'RUB', subject: '',
      counterpartyId: '', otherPartyIds: [],
      object: newObject('realty'),
      performance: { state: 'full', date: '', method: '' },
      // Неравноценность доказывается двумя цифрами: цена по договору и
      // рыночная стоимость по решению об оценке. Либо имущество передано
      // безвозмездно — тогда сравнивать не с чем.
      valuation: {
        gratuitous: false,
        contractPrice: '',   // пусто — берём сумму сделки
        marketValue: '',
        decision: '',        // реквизиты решения об оценке
        note: ''
      },
      grounds: [],          // по каким пунктам оспариваем — выбирается первым шагом
      flags: {
        unequal: false, harm: false, affiliation: false, preference: false,
        awareness: false, sham: false
      },
      affiliationGrounds: [], affiliationNote: '',
      preferenceGrounds: [], preferenceNote: '',
      harmNote: '', awarenessNote: '', shamNote: '', circumstances: '',
      documents: [],
      // Документов по сделке несколько: заявление, ходатайство об отсрочке
      // пошлины, предложение о возврате. Данные у них общие, состав блоков —
      // свой.
      statements: [newStatement('statement')],
      fee: {
        claim: '',            // цена иска; пусто — берём рыночную стоимость объекта
        scale: 'org',         // шкала пп. 1 п. 1 ст. 333.21 НК РФ
        fixedPayer: 'person', // ставка пп. 2 п. 1 ст. 333.21 НК РФ
        withFixed: true,      // включать требование о признании сделки недействительной
        halved: true,         // пп. 9: обособленный спор в деле о банкротстве
        manual: ''            // ручная сумма, если расчёт расходится с практикой суда
      }
    };
  }

  /** Документ по сделке: заявление, ходатайство или предложение. */
  /**
   * Документ сделки.
   *
   * free — режим свободного редактирования. Пока он null, текст каждый раз
   * собирается из блоков и переменных. Как только человек включает свободное
   * редактирование, текущий текст замораживается в free.items, и дальше
   * правится он сам: блоки и данные дела его больше не трогают. Это цена
   * свободы, и приложение говорит о ней вслух, а не выясняется потом.
   */
  function newStatement(kind) {
    return { id: uid(), kind: kind || 'statement', status: 'draft', blocks: [], versions: [], seq: 0, free: null };
  }

  const isFree = (st) => !!(st && st.free && Array.isArray(st.free.items));

  /** Заморозить собранный текст и перейти к свободной правке. */
  function enterFree(db, kase, deal, st) {
    if (isFree(st)) return st.free;
    st.free = { items: buildDocument(db, kase, deal, { mark: false, statement: st }), at: now() };
    return st.free;
  }

  /** Вернуться к сборке из блоков. Свободный текст при этом теряется. */
  function exitFree(st) {
    st.free = null;
  }

  const newPara = (align) => ({ kind: 'p', text: '', align: align || '', bold: false });

  const kindOf = (st) => D.byId(D.DOC_KINDS, (st && st.kind) || 'statement') || D.DOC_KINDS[0];
  const findStatement = (deal, id) => (deal.statements || []).find((x) => x.id === id) || null;
  const mainStatement = (deal) => (deal.statements || [])[0] || null;

  function newDocument() {
    return { id: uid(), name: '', type: 'contract', date: '', number: '', file: '', description: '', attach: true };
  }

  /* ================= загрузка и сохранение ================= */

  function load() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { /* приватный режим */ }
    if (!raw) return newDb();
    try {
      const db = JSON.parse(raw);
      return db && db.cases ? migrate(db) : newDb();
    } catch (e) {
      return newDb();
    }
  }

  function save(db) {
    try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
    catch (e) { return false; }
  }

  /** Дополняет старые записи полями, появившимися позже: чужие данные не теряем. */
  function migrate(db) {
    const base = newDb();
    for (const k of Object.keys(base)) if (db[k] === undefined) db[k] = base[k];
    for (const c of db.cases) {
      const cb = newCase();
      for (const k of Object.keys(cb)) if (c[k] === undefined && k !== 'parties' && k !== 'deals') c[k] = cb[k];
      c.parties = c.parties || [];
      c.deals = c.deals || [];
      c.accounts = (c.accounts || []).map((b) => Object.assign(newBank(), b));
      // Приложение сузилось до банкротства граждан. Процедуры организаций
      // сводим к реализации имущества: у гражданина она и подразумевалась,
      // а «конкурсное производство» стояло просто как значение по умолчанию.
      if ((D.LEGACY_PROCEDURES || []).includes(c.procedure)) c.procedure = 'realization';
      for (const d of c.deals) {
        // Единственное заявление стало списком документов — переносим его,
        // сохранив состав блоков и версии.
        if (d.statement && !d.statements) {
          d.statements = [Object.assign(newStatement('statement'), d.statement)];
          delete d.statement;
        }
        const proto = newDeal();
        for (const k of Object.keys(proto)) if (d[k] === undefined) d[k] = proto[k];
        d.object = Object.assign(newObject(d.object && d.object.kind), d.object || {});
        // Раньше неравноценность описывалась парой «исполнение должника /
        // встречное исполнение». Переносим: то, что отдал должник, — это и есть
        // рыночная стоимость, то, что получил, — цена по договору.
        if (d.counter && !d.valuation.marketValue && !d.valuation.contractPrice) {
          if (d.counter.debtorValue) d.valuation.marketValue = d.counter.debtorValue;
          if (d.counter.counterValue) d.valuation.contractPrice = d.counter.counterValue;
          if (d.counter.state === 'none') d.valuation.gratuitous = true;
          if (d.counter.note || d.counter.reasons) d.valuation.note = d.counter.note || d.counter.reasons;
        }
        d.statements = (d.statements.length ? d.statements : [newStatement('statement')])
          .map((st) => Object.assign(newStatement(st.kind), st));
      }
    }
    db.schema = SCHEMA;
    return db;
  }

  /* ================= стороны ================= */

  const partyName = (p) => {
    if (!p) return '';
    if (p.kind === 'org') return p.nameFull || p.nameShort || '';
    if (p.kind === 'ip') return p.fio ? 'индивидуальный предприниматель ' + p.fio : '';
    return p.fio || '';
  };

  const partyShort = (p) => {
    if (!p) return '';
    if (p.kind === 'org') return p.nameShort || p.nameFull || '';
    if (p.kind === 'ip') return p.fio ? 'ИП ' + p.fio : '';
    return p.fio || '';
  };

  const partyInn = (p) => (p ? p.inn : '') || '';
  const partyOgrn = (p) => (p ? (p.kind === 'ip' ? p.ogrnip : p.ogrn) : '') || '';
  const partyAddress = (p) => (p ? (p.kind === 'org' ? (p.addressLegal || p.addressPostal) : p.address) : '') || '';

  /** «ИНН 1234567890, ОГРН 1234567890123» — только то, что заполнено. */
  function partyRequisites(p) {
    if (!p) return '';
    const bits = [];
    if (partyInn(p)) bits.push('ИНН ' + partyInn(p));
    if (partyOgrn(p)) bits.push((p.kind === 'ip' ? 'ОГРНИП ' : 'ОГРН ') + partyOgrn(p));
    if (p.kind === 'person' && p.birthDate) bits.push('дата рождения ' + D.dateShort(p.birthDate));
    return bits.join(', ');
  }

  const findParty = (kase, id) => (kase.parties || []).find((p) => p.id === id) || null;
  const debtorOf = (kase) => findParty(kase, kase.debtorId);
  const counterpartyOf = (kase, deal) => findParty(kase, deal.counterpartyId);

  /* ================= описание объекта ================= */

  function objectDescription(deal) {
    const o = deal.object || {};
    const bits = [];
    if (o.kind === 'realty') {
      if (o.realtyKind) bits.push(o.realtyKind.toLowerCase());
      if (o.address) bits.push('расположенный по адресу: ' + o.address);
      if (o.cadastral) bits.push('кадастровый номер ' + o.cadastral);
      if (o.area) bits.push('площадью ' + o.area + ' кв. м');
      if (o.purpose) bits.push('назначение: ' + o.purpose);
      if (o.features) bits.push(o.features);
    } else if (o.kind === 'vehicle') {
      const car = [o.brand, o.model].filter(Boolean).join(' ');
      if (car) bits.push('транспортное средство ' + car);
      if (o.year) bits.push(o.year + ' года выпуска');
      if (o.vin) bits.push('VIN ' + o.vin);
      if (o.plate) bits.push('государственный регистрационный знак ' + o.plate);
    } else if (o.kind === 'money') {
      if (o.sum !== '' && o.sum != null) bits.push('денежные средства в размере ' + D.money(o.sum) + ' руб.');
      if (o.orderNumber) bits.push('платёжное поручение № ' + o.orderNumber);
      if (o.payDate) bits.push('от ' + D.dateShort(o.payDate));
      if (o.accountFrom) bits.push('со счёта ' + o.accountFrom);
