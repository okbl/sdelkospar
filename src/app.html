<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оспаривание сделок — конструктор заявлений</title>
<style>
/*
 * Оформление: бумага.
 *
 * Приложение делает документы, и выглядит оно как стол с документом.
 * Белый фон, чёрный текст, линии в один пиксель. Ни карточек, ни теней,
 * ни скруглений, ни градиентов: украшать инструмент, которым работают
 * каждый день, — значит каждый день мешать.
 *
 * Цвет ровно один — тёмно-красный, и только там, где чего-то не хватает:
 * незаполненная переменная, обязательное поле, ошибка проверки. Если он
 * появился на экране, его видно сразу, потому что больше цвета нигде нет.
 *
 * Интерфейс набран системным гротеском мелким кеглем, документ — Times,
 * как его увидит суд. Лист везде имеет пропорции A4 и поля документа,
 * поэтому строка получает нормальную длину и текст не читается массой.
 */
:root{
  --pn:#fff;--bg:#fff;
  --ink:#111;--ink-2:#4a4a4a;--ink-3:#7a7a7a;--ink-4:#a8a8a8;
  --line:#e0e0e0;--line-2:#c4c4c4;--rule:#111;
  --acc:#8a1500;--acc-wash:#fbeeea;
  --sheet-w:794px;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600}
button,input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.page{max-width:1120px;margin:0 auto;padding:0 20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Надпись раздела: мелкая прописная. Заголовков крупным кеглем в приложении
   нет вовсе — иерархию держат линии и расстояния. */
.lbl{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);
  margin:0 0 8px}
.m{font-size:12px;color:var(--ink-3);line-height:1.45;margin:0}
.hint{font-size:11.5px;color:var(--ink-3);line-height:1.5;margin:5px 0 0}

/* ---------- строка состояния вместо шапки ---------- */
.top{border-bottom:1px solid var(--rule)}
.top .in{display:flex;align-items:baseline;gap:0;padding:8px 0;flex-wrap:wrap;font-size:12px}
.path{color:var(--ink-3);min-width:0}
.path b{color:var(--ink);font-weight:600}
.path a{color:var(--ink-3);text-decoration:none;border-bottom:1px solid var(--line-2)}
.path a:hover{color:var(--ink);border-color:var(--ink)}
.path i{font-style:normal;color:var(--ink-4);margin:0 7px}
.act{margin-left:auto;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}

/* Кнопка — подчёркнутое слово. Отдельно рисуются только те, что начинают
   действие с последствиями: выгрузка, создание, удаление. */
.btn{border:0;background:none;padding:0;font:inherit;font-size:12px;color:var(--ink);cursor:pointer;
  border-bottom:1px solid var(--ink);white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
.btn:disabled{color:var(--ink-4);border-color:var(--line-2);cursor:not-allowed}
.btn.pri{font-weight:600}
.btn.danger:hover{color:var(--acc);border-color:var(--acc)}
.btn-sm{font-size:11.5px}
.linkbtn{border:0;background:none;padding:0;font:inherit;font-size:12px;color:var(--ink-3);cursor:pointer;
  border-bottom:1px solid var(--line-2)}
.linkbtn:hover{color:var(--ink);border-color:var(--ink)}

/* ---------- реестр дел ---------- */
.reg{padding:24px 0 48px}
.reg-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;
  border-bottom:1px solid var(--rule);padding-bottom:9px}
.reg-top h1{font-size:15px;font-weight:600}
.reg-top .m{margin-top:2px}
.reg-act{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.find{width:100%;max-width:330px;margin:16px 0 4px;padding:5px 0;font:inherit;font-size:12.5px;
  color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line-2);outline:none}
.find:focus{border-color:var(--ink)}
.find::placeholder{color:var(--ink-4)}
.reg-body{margin-top:2px}
.reg-table .no{font-weight:600;white-space:nowrap}
.sortb{border:0;background:none;padding:0;font:inherit;font-size:10.5px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;white-space:nowrap}
.sortb:hover{color:var(--ink)}
.sortb.on{color:var(--ink)}

/* приглашение начать — видно ровно один раз, до первого дела */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  width:100%;margin-top:20px;padding:52px 30px;text-align:center;font:inherit;color:inherit;
  border:1px dashed var(--line-2);background:none;cursor:pointer}
.drop:hover{border-color:var(--ink);}
.drop b{font-size:15px;font-weight:600}
.drop span{color:var(--ink-3);font-size:12.5px}
.drop .ic{display:none}

/* ---------- заголовок экрана ---------- */
/* Одинаково устроен на деле, сделке и библиотеке: слева кто это, справа
   что с ним можно сделать, ниже — сухая сводка определениями. */
.scr{padding:20px 0 0}
.scr-top{display:flex;align-items:baseline;justify-content:space-between;gap:18px;flex-wrap:wrap;
  border-bottom:1px solid var(--rule);padding-bottom:9px}
.scr-top h1{font-size:15px;font-weight:600}
.scr-top .m{margin-top:2px;max-width:80ch}
.scr-act{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}

/* Сводка: определения в строку. Крупных цифр нет — они ничего не решают,
   а места занимают больше всего. */
.facts{display:flex;flex-wrap:wrap;gap:0 30px;margin:11px 0 0}
.facts>div{padding:3px 0}
.facts>div.wide{flex-basis:100%;margin-top:3px}
.facts dt{display:inline;font-size:11.5px;color:var(--ink-3)}
.facts dt::after{content:":  ";white-space:pre}
.facts dd{display:inline;margin:0;font-size:12.5px;color:var(--ink);font-weight:600}
.facts dd .linkbtn{font-weight:400;margin-left:6px}
.bad{color:var(--acc)}

/* строка документа в конструкторе */
.docbar{display:flex;align-items:baseline;justify-content:space-between;gap:18px;flex-wrap:wrap;
  padding:14px 0 0;border-bottom:1px solid var(--line)}
.docbar .which{display:flex;gap:20px;flex-wrap:wrap}
.docbar .tab{padding-bottom:9px;margin-bottom:-1px}
.docbar .scr-act{padding-bottom:9px}
.railacts{display:flex;flex-direction:column;gap:6px;align-items:flex-start}

/* ---------- вкладки ---------- */
.tabs{display:flex;gap:22px;padding:0;margin:22px 0 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;background:none;padding:0 0 7px;margin-bottom:-1px;font:inherit;font-size:12.5px;
  color:var(--ink-3);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:600;border-color:var(--ink)}
.tab .n{color:var(--ink-4);font-weight:400;margin-left:5px}

/* ---------- разделы страницы ---------- */
/* Карточек нет: раздел отделён линией и надписью, а не рамкой с тенью. */
.card{background:none;border:0;border-top:1px solid var(--line);padding:18px 0 4px;margin:0}
.card:first-of-type{border-top:0;padding-top:20px}
.card>h3{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;margin-bottom:5px}
.card>.m{margin-bottom:14px;max-width:78ch}
.note{padding:10px 0 10px 13px;font-size:12.5px;line-height:1.55;margin:0 0 12px;
  border-left:2px solid var(--line-2);color:var(--ink-2);background:none}
.note b{color:var(--ink);font-weight:600}
.note.calm{border-color:var(--line)}
.note.good{border-color:var(--line-2)}
.empty{border:0;border-top:1px solid var(--line);padding:36px 0;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px;font-weight:600}

/* Шкала осталась одна — доля готовых заявлений; рисуется линией, не полосой. */
.meter{height:1px;background:var(--line);min-width:36px;margin:7px 0}
.meter i{display:block;height:1px;background:var(--ink-3)}
.meter i.done{background:var(--ink)}
.chipm{font-size:11.5px;color:var(--ink-3);display:inline-flex;align-items:baseline;gap:6px}
.chipm .dot{width:5px;height:5px;border-radius:50%;background:var(--ink-4);flex:none}
.chipm.w{color:var(--acc)}
.chipm.w .dot{background:var(--acc)}

/* ---------- формы ---------- */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px 20px}
.f{min-width:0}
.f.wide{grid-column:1/-1}
label.lb{display:block;font-size:11px;color:var(--ink-3);margin-bottom:3px}
label.lb .req{color:var(--acc)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;
  border:0;border-bottom:1px solid var(--line-2);background:none;border-radius:0;padding:5px 0;
  font-size:13px;color:var(--ink)}
select{padding-right:16px}
textarea{resize:vertical;min-height:70px;line-height:1.5;border:1px solid var(--line-2);padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
input[readonly]{color:var(--ink-3)}
input.bad,textarea.bad,select.bad{border-color:var(--acc)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);padding:4px 0;cursor:pointer}
.chk:hover{color:var(--ink)}
.chk input{width:13px;height:13px;accent-color:var(--ink);margin:2px 0 0;flex:none}

/* «или — или» набирается словами через разделитель, а не таблетками */
.radios{display:flex;gap:14px;flex-wrap:wrap;padding:3px 0}
.radio{font-size:12.5px;color:var(--ink-3);cursor:pointer;display:inline-flex;align-items:center;
  border-bottom:1px solid transparent}
.radio:hover{color:var(--ink)}
.radio.on{color:var(--ink);font-weight:600;border-color:var(--ink)}
.radio input{display:none}

/* ---------- выбор основания оспаривания ---------- */
.grounds{display:flex;flex-direction:column;gap:0;margin-top:12px;border-top:1px solid var(--line)}
.ground{display:block;border:0;border-bottom:1px solid var(--line);padding:11px 0 11px 18px;
  cursor:pointer;background:none;position:relative}
.ground:hover b{text-decoration:underline;text-underline-offset:2px}
.ground input{position:absolute;opacity:0;pointer-events:none}
.ground::before{content:"";position:absolute;left:0;top:14px;width:11px;height:11px;
  border:1px solid var(--line-2)}
.ground.on::before{background:var(--ink);border-color:var(--ink)}
.ground b{display:block;font-size:13px;font-weight:600}
.ground .law{display:block;font-size:11.5px;color:var(--ink-3);margin:1px 0 3px}
.ground .m{display:block;max-width:80ch}
.ground:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:1px}
.step{}

/* ---------- таблицы ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);padding:0 10px 6px;white-space:nowrap;border-bottom:1px solid var(--rule)}
th:first-child{padding-left:0}th:last-child{padding-right:0}
th.r{text-align:right}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{padding-left:0}td:last-child{padding-right:0}
td.r{text-align:right;white-space:nowrap}
td.sub{color:var(--ink-3)}
tbody tr:hover td{background:#f7f7f7}
tr.click{cursor:pointer}
.pill{display:inline-block;font-size:11.5px}
.pill.draft{color:var(--ink-3)}
.pill.ready{color:var(--ink);font-weight:600}
.rowact{display:flex;gap:14px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- строки списков: стороны, банки, блоки библиотеки ---------- */
.party{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);
  margin:0;background:none;border-radius:0}
.party:first-of-type{border-top:1px solid var(--line)}
.party .nm{font-weight:600;font-size:13px}
.party .rq{font-size:11.5px;color:var(--ink-3)}
.party .tag{font-size:11px;color:var(--ink-3);flex:none}
.party .sp{margin-left:auto;display:flex;gap:14px;align-items:baseline}

/* ---------- конструктор ---------- */
.builder{display:grid;grid-template-columns:258px minmax(0,1fr);gap:0;align-items:start;
  padding-bottom:48px}
.bcol-form{position:sticky;top:0;max-height:100vh;overflow:auto;padding:20px 22px 30px 0;
  border-right:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.bcol-paper{padding:22px 0 0 26px;display:flex;flex-direction:column;align-items:center;gap:20px}
.blocks{background:none;border:0;border-radius:0;box-shadow:none;overflow:visible}
.blocks .bh{display:block;padding:0 0 7px;border-bottom:0}
.blocks .bh h3{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.blocks .bh .m{margin:2px 0 0}
.blk{border-bottom:0}
.blk.drag{opacity:.35}
.blk.over{box-shadow:inset 0 1px 0 var(--ink)}
.blk .row{display:flex;align-items:flex-start;gap:7px;padding:3px 0;line-height:1.3;flex-wrap:wrap}
.blk .row:hover{background:none}
.blk .row:hover .nm b{text-decoration:underline;text-underline-offset:2px}
.blk .grip{cursor:grab;color:var(--ink-4);flex:none;width:9px;text-align:center;line-height:1.3;
  font-size:11px;user-select:none}
.blk .grip:active{cursor:grabbing}
.blk input[type=checkbox]{width:12px;height:12px;accent-color:var(--ink);flex:none;margin:2px 0 0}
.blk .nm{flex:1;min-width:0;font-size:12.5px;cursor:pointer}
.blk .nm b{display:block;font-weight:500}
.blk .nm span{display:none}
.blk.off .nm b{color:var(--ink-4)}
/* Пометка не влезает рядом с названием в узкую колонку — уводим её
   на свою строку под названием, иначе она наезжает на текст. */
.blk .flag{font-size:10.5px;color:var(--ink-3);flex-basis:100%;margin-left:28px;
  white-space:normal;line-height:1.3}
.blk .flag.cond{color:var(--acc)}
.blk .flag.edit{color:var(--ink-2)}
.blk .body{padding:6px 0 12px 16px;background:none;border-top:0}
.blk .body textarea{min-height:150px;font-size:12.5px;line-height:1.55}
.blk .body .tools{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-top:7px}

/* лист предпросмотра: формат A4 и поля документа */
.preview{background:none;border:0;border-radius:0;box-shadow:none;overflow:visible;width:100%;
  display:flex;flex-direction:column;align-items:center;gap:9px}
.preview .ph{display:flex;align-items:baseline;gap:10px;padding:0;border-bottom:0;
  width:var(--sheet-w);max-width:100%}
.preview .ph h3{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.preview .ph .m{margin-left:auto}
.paper{width:var(--sheet-w);max-width:100%;min-height:1123px;padding:76px 57px 76px 113px;
  max-height:none;overflow:visible;background:#fff;border:1px solid var(--line-2);
  font-family:"Times New Roman",Times,serif;font-size:15px;line-height:1.5;color:#000}
.paper p{margin:0;text-align:justify;text-indent:1.25em;hyphens:auto}
.paper p.center{text-align:center;text-indent:0}
.paper p.right{text-align:right;text-indent:0}
.paper p.left{text-align:left;text-indent:0}
.paper p.b{font-weight:700}
.paper .miss{color:var(--acc);border-bottom:1px solid var(--acc);white-space:nowrap;
  font-family:inherit;font-size:inherit;background:none;padding:0}
.paper .dt{width:100%;border-collapse:collapse;font-size:.8em;margin:.5em 0;text-indent:0}
.paper .dt th,.paper .dt td{border:1px solid #666;padding:3px 5px;vertical-align:top}
.paper .dt th{font-weight:700;text-align:center}
.paper .dt .left{text-align:left}.paper .dt .right{text-align:right}.paper .dt .center{text-align:center}
.paper .dt tr.tot td{font-weight:700}
.paper .dnote{font-size:.78em;font-style:italic;text-indent:0;color:#555}

/* замечания — строками под листом */
.check{width:var(--sheet-w);max-width:100%}
.check h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink);font-weight:600;
  margin-bottom:5px}
.check .note.warn h4{color:var(--acc)}
.check ul{margin:5px 0 0;padding:0;list-style:none}
.check li{font-size:12.5px;color:var(--ink-2);margin:0;line-height:1.5;padding:3px 0 3px 14px;
  position:relative}
.check li::before{content:"—";position:absolute;left:0;color:var(--ink-4)}
.check .note.warn li::before{color:var(--acc)}

/* ---------- модальные окна ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(17,17,17,.28);
  display:flex;align-items:flex-start;justify-content:center;padding:6vh 18px;overflow:auto}
.modal .box{background:#fff;border:1px solid var(--rule);border-radius:0;width:100%;max-width:660px;
  box-shadow:none;padding:20px 22px 16px}
.modal .box.wide{max-width:1000px}
.modal h3{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;margin-bottom:6px}
.modal .lead{font-size:12.5px;color:var(--ink-2);margin:0 0 14px;line-height:1.5}
.modal .foot{display:flex;gap:16px;justify-content:flex-end;align-items:baseline;flex-wrap:wrap;
  border-top:1px solid var(--line);padding-top:12px;margin-top:16px}
.modal .foot .left{margin-right:auto}

.vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.vars h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink);margin-bottom:5px}
.vars button{display:block;width:100%;text-align:left;border:0;background:none;padding:2px 0;
  font-size:12px;color:var(--ink-2);cursor:pointer}
.vars button:hover{color:var(--acc)}
.vars code{font-size:11px;color:var(--ink-3);display:block;font-family:inherit}

.versions .v{display:flex;align-items:baseline;gap:12px;padding:9px 0;border:0;
  border-bottom:1px solid var(--line);margin:0;background:none;flex-wrap:wrap;
  font-size:12.5px;font-weight:400}
.versions .v:first-of-type{border-top:1px solid var(--line)}
.versions .v b{font-size:12.5px;font-weight:600}
.versions .v .m{flex:1;min-width:120px}
.diff{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5;
  background:none;border:1px solid var(--line);border-radius:0;padding:11px;
  max-height:52vh;overflow:auto;white-space:pre-wrap;word-break:break-word}
.diff .add{color:var(--ink);display:block}
.diff .add::before{content:"+ ";color:var(--ink-4)}
.diff .del{color:var(--acc);display:block;text-decoration:line-through}
.diff .del::before{content:"− ";color:var(--acc);text-decoration:none;display:inline-block}
.diff .same{color:var(--ink-4);display:block}
.diff .same::before{content:"  "}

/* ---------- листы для печати ---------- */
.sheets{background:#efefef;padding:16px;border-radius:0;max-height:calc(100vh - 250px);
  overflow:auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.sheet{width:210mm;min-height:297mm;background:#fff;border:1px solid var(--line-2);box-shadow:none;
  padding:20mm 15mm 20mm 30mm;position:relative;flex:none;
  font-family:"Times New Roman",Times,serif;font-size:14pt;line-height:1.5;color:#000;
  transform:scale(var(--zoom,1));transform-origin:top center}
.sheetbody p,.docmeasure p{margin:0;text-align:justify;text-indent:1.25em}
.sheetbody p.center,.docmeasure p.center{text-align:center;text-indent:0}
.sheetbody p.right,.docmeasure p.right{text-align:right;text-indent:0}
.sheetbody p.left,.docmeasure p.left{text-align:left;text-indent:0}
.sheetbody p.b,.docmeasure p.b{font-weight:700}
/* Таблицы документа. Метрики листа и контейнера для замера описаны одним
   правилом — разъедутся они, и раскладка по страницам поедет вместе с ними. */
.sheetbody .dt,.docmeasure .dt{width:100%;border-collapse:collapse;font-size:11pt;
  margin:.4em 0;text-indent:0;table-layout:fixed}
.sheetbody .dt th,.docmeasure .dt th{border:1px solid #000;padding:2pt 4pt;font-weight:700;
  text-align:center;vertical-align:top;word-wrap:break-word}
.sheetbody .dt td,.docmeasure .dt td{border:1px solid #000;padding:2pt 4pt;
  vertical-align:top;word-wrap:break-word}
.sheetbody .dt .left,.docmeasure .dt .left{text-align:left}
.sheetbody .dt .right,.docmeasure .dt .right{text-align:right}
.sheetbody .dt .center,.docmeasure .dt .center{text-align:center}
.sheetbody .dt tr.tot td,.docmeasure .dt tr.tot td{font-weight:700}
.sheetbody .dnote,.docmeasure .dnote{font-size:10pt;font-style:italic;text-indent:0;margin:.2em 0 .6em}
.docmeasure .mi{margin:0;padding:0}
.sheetnum{position:absolute;left:0;right:0;bottom:9mm;text-align:center;font-size:11pt;color:#444}
/* Контейнер для замера высот: те же метрики, но вне потока и вне глаз. */
.docmeasure{position:absolute;left:-10000px;top:0;visibility:hidden;
  font-family:"Times New Roman",Times,serif;font-size:14pt;line-height:1.5}

/* ---------- печать ---------- */
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  body.printmode>*{display:none!important}
  body.printmode>#modal-root{display:block!important}
  body.printmode .modal{display:block!important;position:static;background:none;padding:0;overflow:visible}
  body.printmode .modal .box{box-shadow:none;border:0;padding:0;max-width:none;background:#fff;
    overflow:visible}
  body.printmode .modal .box>*:not(.sheets){display:none!important}
  body.printmode .sheets{background:#fff;padding:0;max-height:none;overflow:visible;display:block}
  body.printmode .sheet{border:0;margin:0!important;transform:none!important;break-after:page}
  body.printmode .sheet:last-child{break-after:auto}
}

/* ---------- узкие экраны ---------- */
@media (max-width:1060px){
  .builder{grid-template-columns:1fr}
  .bcol-form{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);
    padding:20px 0 18px}
  .bcol-paper{padding:20px 0 0}
}
@media (max-width:860px){
  .paper{padding:40px 24px}
  .preview .ph,.check,.paper{width:100%}
}
@media (max-width:640px){
  .page{padding:0 14px}
  .modal{padding:0}
  .modal .box{border:0;min-height:100vh;padding:16px 14px}
  table,thead,tbody,th,td,tr{display:block}
  thead{display:none}
  td{border:0;padding:2px 0}
  tbody tr{border-bottom:1px solid var(--line);padding:11px 0}
  tbody tr:hover td{background:none}
  td.r{text-align:left}
  td[data-l]::before{content:attr(data-l) ": ";color:var(--ink-3)}
  .rowact{justify-content:flex-start;margin-top:5px}
  .sheets{padding:6px;max-height:none}
}
</style>
