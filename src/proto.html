<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>СделкоСпар — прототип</title>
<style>
/*
 * Прототип по концепту: строгий рабочий инструмент без левого меню.
 * Светлый фон #F7F8FA, белые блоки, границы в 1px, радиус 10–12,
 * графитовый текст, один акцентный цвет, никаких градиентов.
 * Поля и главные кнопки высотой 46px, рабочая колонка 760px.
 * Акцент задан одной переменной --accent — его легко поменять.
 */
:root{
  --bg:#F7F8FA;--surface:#FFFFFF;--surface-2:#F1F3F6;
  --border:#E3E6EB;--border-2:#CDD2D9;
  --text:#1B1F24;--text-2:#4F5761;--text-3:#7D8590;
  --accent:#1F4E8C;--accent-2:#173E70;--accent-soft:#EAF0F8;--on-accent:#FFFFFF;
  --ok:#1F7A4D;--ok-soft:#E8F4EE;--warn:#9A5B00;--warn-soft:#FFF4E0;--bad:#B42318;--bad-soft:#FDECEA;
  --r:12px;--r-sm:10px;--h:46px;--w:760px;
  --shadow:0 1px 2px rgba(16,24,40,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1115;--surface:#171A20;--surface-2:#1E222A;--border:#272C35;--border-2:#363C47;
    --text:#E7EAEE;--text-2:#B1B8C2;--text-3:#808894;
    --accent:#7FA6E6;--accent-2:#A2C0F0;--accent-soft:#1B2636;--on-accent:#0F1115;
    --ok:#5BC08C;--ok-soft:#14261D;--warn:#E3A948;--warn-soft:#2A2113;--bad:#F07A6E;--bad-soft:#2C1715;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1115;--surface:#171A20;--surface-2:#1E222A;--border:#272C35;--border-2:#363C47;
  --text:#E7EAEE;--text-2:#B1B8C2;--text-3:#808894;
  --accent:#7FA6E6;--accent-2:#A2C0F0;--accent-soft:#1B2636;--on-accent:#0F1115;
  --ok:#5BC08C;--ok-soft:#14261D;--warn:#E3A948;--warn-soft:#2A2113;--bad:#F07A6E;--bad-soft:#2C1715;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- верхняя панель ---------- */
.bar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border)}
.bar .in{max-width:1120px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em;
  cursor:pointer;background:none;border:0;padding:0}
.logo svg.i{width:22px;height:22px;color:var(--accent)}
.tag{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px}
.bar .sp{margin-left:auto;display:flex;align-items:center;gap:6px}
.saved{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-3);padding:0 10px;
  border-right:1px solid var(--border);margin-right:4px}
.saved.busy{color:var(--warn)}
.ghost{height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 11px;border-radius:8px;
  border:0;background:none;color:var(--text-2);font-size:14px;cursor:pointer}
.ghost:hover{background:var(--surface-2);color:var(--text)}
.menu{position:absolute;right:20px;top:52px;min-width:240px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);box-shadow:0 12px 32px -12px rgba(16,24,40,.25);padding:6px;z-index:40}
.menu .who{display:flex;align-items:center;gap:10px;padding:10px 10px 12px;border-bottom:1px solid var(--border);margin-bottom:6px}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;
  border-radius:8px;font-size:14px;cursor:pointer;text-align:left;color:var(--text)}
.menu button:hover{background:var(--surface-2)}
.menu button.only-m{display:none}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.ava{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.ava.big{width:64px;height:64px;font-size:22px}

/* ---------- рабочая колонка ---------- */
.wrap{max-width:var(--w);margin:0 auto;padding:28px 20px 120px}
.wrap.wide{max-width:1120px}
.muted{color:var(--text-3)}
.small{font-size:13px}
.lead{color:var(--text-2);margin:6px 0 0}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px 24px;
  box-shadow:var(--shadow);margin-top:16px}
.card>h2{font-size:17px;margin-bottom:4px}
.card>.lead{margin:0 0 16px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.f{display:flex;flex-direction:column;gap:6px;margin-top:14px;min-width:0}
.f:first-child{margin-top:0}
.row2 .f{margin-top:0}
.f label{font-size:13.5px;font-weight:500;color:var(--text-2)}
.f .req{color:var(--bad)}
.f .help{font-size:12.5px;color:var(--text-3)}
.inp{position:relative;display:flex;align-items:center}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;height:var(--h);
  border:1px solid var(--border-2);background:var(--surface);border-radius:var(--r-sm);padding:0 14px;
  font-size:15px;color:var(--text);transition:border-color .12s,box-shadow .12s}
select{appearance:none;-webkit-appearance:none;padding-right:36px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat}
textarea{height:auto;min-height:120px;padding:12px 14px;line-height:1.55;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--text-3)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp .suf{position:absolute;right:14px;color:var(--text-3);pointer-events:none}
.inp input.money{padding-right:34px}
.f.miss input,.f.miss select,.f.miss textarea{border-color:var(--bad)}
.f.miss .help.m{color:var(--bad)}

/* кнопки */
.btn{height:var(--h);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;
  border-radius:var(--r-sm);border:1px solid var(--border-2);background:var(--surface);color:var(--text);
  font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.sm{height:36px;padding:0 13px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--accent);font-size:14px;font-weight:500;cursor:pointer}
.link:hover{text-decoration:underline}
.seg{display:inline-flex;border:1px solid var(--border-2);border-radius:var(--r-sm);overflow:hidden;height:40px}
.seg button{border:0;background:var(--surface);padding:0 16px;font-size:14px;cursor:pointer;color:var(--text-2);
  border-right:1px solid var(--border-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* ---------- главная ---------- */
.home{text-align:center;padding-top:36px}
.home h1{font-size:30px;letter-spacing:-.02em}
.bigcard{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;margin-top:28px;padding:38px 24px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;
  box-shadow:var(--shadow);transition:border-color .12s,box-shadow .12s;font:inherit;color:inherit}
.bigcard:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bigcard .plus{width:48px;height:48px;border-radius:12px;background:var(--accent);color:var(--on-accent);
  display:flex;align-items:center;justify-content:center}
.bigcard .plus svg.i{width:24px;height:24px}
.bigcard b{font-size:17px;letter-spacing:.02em}
.linecard{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;padding:16px 20px;text-align:left;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;font:inherit;color:inherit}
.linecard:hover{border-color:var(--border-2);background:var(--surface-2)}
.linecard svg.i{color:var(--text-2);width:22px;height:22px}
.linecard b{display:block;font-size:15px}
.last{text-align:left;margin-top:30px;padding-top:22px;border-top:1px solid var(--border)}
.last .cap{font-size:13px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}
.last .box{display:flex;align-items:flex-end;gap:14px;justify-content:space-between;margin-top:10px;flex-wrap:wrap}

/* ---------- шаги ---------- */
.head{display:flex;align-items:center;gap:12px}
.head h1{font-size:22px;flex:1;text-align:center}
.head .spacer{width:90px}
.progress{display:flex;align-items:center;gap:0;margin:22px 0 4px}
.dot{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-3);white-space:nowrap;cursor:pointer;
  background:none;border:0;padding:0}
.dot i{width:12px;height:12px;border-radius:50%;border:2px solid var(--border-2);background:var(--surface);flex:none}
.dot.done{color:var(--text-2)}.dot.done i{background:var(--accent);border-color:var(--accent)}
.dot.on{color:var(--text);font-weight:600}.dot.on i{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.line{flex:1;height:2px;background:var(--border);margin:0 12px;min-width:24px}
.line.done{background:var(--accent)}
.substep{font-size:13px;color:var(--text-3);margin-bottom:6px}

/* липкая нижняя панель */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--border);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
.dock .in{max-width:var(--w);margin:0 auto;display:flex;align-items:center;gap:12px}
.dock .in .grow{flex:1;font-size:13px;color:var(--text-3)}

/* основания */
.gcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:20px 22px;margin-top:12px;cursor:pointer;font:inherit;color:inherit;position:relative;transition:border-color .12s,box-shadow .12s}
.gcard:hover{border-color:var(--border-2)}
.gcard .law{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.gcard b{display:block;font-size:17px;margin-top:6px}
.gcard p{margin:6px 0 0;color:var(--text-2);font-size:14px;max-width:560px}
.gcard .pick{position:absolute;right:20px;bottom:18px;font-size:14px;font-weight:500;color:var(--accent)}
.gcard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gcard.on .pick{color:var(--ok)}
.gcard .chk{position:absolute;right:20px;top:18px;width:24px;height:24px;border-radius:50%;background:var(--accent);
  color:var(--on-accent);display:flex;align-items:center;justify-content:center}

/* обстоятельства: вопросы слева, подсказка справа */
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.hintp{position:sticky;top:76px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px}
.hintp h3{font-size:15px;margin-bottom:10px}
.hintp .el{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;margin:0 0 9px;color:var(--text-2)}
.hintp .el .st{width:18px;height:18px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;margin-top:1px}
.st.y{background:var(--ok-soft);color:var(--ok)}.st.n{background:var(--bad-soft);color:var(--bad)}.st.u{background:var(--surface-2);color:var(--text-3)}
.hintp .per{font-size:13.5px;border-top:1px solid var(--border);padding-top:12px;margin-top:12px;color:var(--text-2)}
.hintp .gen{font-size:13px;border-top:1px solid var(--border);padding-top:12px;margin-top:12px;color:var(--text-2);
  font-family:"Times New Roman",Times,serif;line-height:1.5}
.q{padding:16px 0;border-top:1px solid var(--border)}
.q:first-of-type{border-top:0;padding-top:4px}
.q .t{font-weight:500;margin-bottom:10px}
.yn{display:inline-flex;gap:8px;flex-wrap:wrap}
.yn button{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--border-2);background:var(--surface);
  font-size:14px;cursor:pointer;color:var(--text-2);display:inline-flex;align-items:center;gap:7px}
.yn button::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--border-2);box-sizing:border-box}
.yn button.on{border-color:var(--accent);color:var(--text);background:var(--accent-soft)}
.yn button.on::before{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 2px var(--surface)}
.sub{margin-top:12px;padding-left:14px;border-left:2px solid var(--border)}
.verdict{font-size:14px;margin-top:12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--text-2)}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}

/* доказательства */
.drop{border:2px dashed var(--border-2);border-radius:var(--r);padding:36px 20px;text-align:center;background:var(--surface);
  transition:border-color .12s,background .12s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .btn{margin:10px 0 8px}
.doc{border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-top:12px;background:var(--surface)}
.doc .top{display:flex;align-items:center;gap:10px}
.doc .top b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .ok{color:var(--ok)}

/* проверка */
.sec{padding:18px 0;border-top:1px solid var(--border)}
.sec:first-child{border-top:0;padding-top:0}
.sec .cap{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 14px;font-size:15px}
.kv dt{color:var(--text-3)}.kv dd{margin:0}
.kv dd.no{color:var(--bad)}
.sec .edit{display:flex;justify-content:flex-end;margin-top:8px}

/* готово */
.finish{text-align:center;padding-top:30px}
.finish .ico{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;
  justify-content:center;margin:0 auto 14px}
.finish .ico svg.i{width:30px;height:30px;stroke-width:2.2}
.finish .actbox{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;padding:20px 22px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r);cursor:pointer;font:inherit;color:inherit;font-size:16px;font-weight:500}
.finish .actbox:hover{border-color:var(--accent)}
.finish .actbox svg.i{color:var(--accent);width:22px;height:22px}

/* списки */
.list .item{display:flex;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--border)}
.list .item:first-child{border-top:0}
.list .item .who{flex:1;min-width:0}
.list .item b{display:block}

/* настройки */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--border)}
.setrow:first-child{border-top:0}
.pillok{font-size:13px;font-weight:600;color:var(--ok);display:inline-flex;align-items:center;gap:6px}
.pillok::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.warnbox{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--warn);font-size:14px;margin-top:14px}

/* окно предпросмотра и сообщения */
.modal{position:fixed;inset:0;z-index:60;background:rgba(16,24,40,.45);display:flex;align-items:flex-start;justify-content:center;
  padding:5vh 16px;overflow:auto}
.modal .box{background:var(--surface);border-radius:var(--r);width:100%;max-width:520px;padding:22px 24px;
  box-shadow:0 24px 60px -20px rgba(16,24,40,.45)}
.modal .box.sheetbox{max-width:880px;background:var(--surface-2);padding:18px}
.modal h3{font-size:18px}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:14px;z-index:70}

/* лист A4 — одинаковый в светлой и тёмной теме */
.paper{width:794px;max-width:100%;margin:12px auto 0;background:#fff;color:#111;border-radius:4px;
  padding:76px 57px 76px 113px;font:15px/1.5 "Times New Roman",Times,serif;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.paper p{margin:0;text-align:justify;text-indent:1.25em}
.paper p.center{text-align:center;text-indent:0}.paper p.right{text-align:right;text-indent:0}
.paper p.left{text-align:left;text-indent:0}.paper p.b{font-weight:700}
.paper .miss{background:#FDECEA;color:#B42318;border-radius:3px;padding:0 4px;font:12px/1.4 -apple-system,"Segoe UI",sans-serif}

/* ---------- телефон ---------- */
@media (max-width:760px){
  .head h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .head .spacer{width:0}
  .row2{grid-template-columns:1fr}
  .split{grid-template-columns:1fr}
  .hintp{position:static}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px}
  .bar .hide-m{display:none}
  .menu button.only-m{display:flex}
  .head .spacer{display:none}
  .head h1{text-align:left;font-size:19px}
  .progress .dot span{display:none}
  .dock .in .grow{display:none}
  .dock .in .btn{flex:1}
  .paper{padding:36px 22px}
  .gcard .pick{position:static;display:block;margin-top:10px}
}
</style>
</head>
<body>
<header class="bar"><div class="in" id="bar"></div></header>
<main id="app"></main>
<div id="dock"></div>
<div id="modal-root"></div>
